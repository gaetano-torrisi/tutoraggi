function timeStrToH(s){const[hh,mm]=s.split(":").map(Number);return hh+(mm||0)/60;}

function looksLikeCalendar(text){
  const patterns=[/\b\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4}\b/,/\b\d{1,2}:\d{2}\b/,/\b(gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)\b/i,/\b(lun|mar|mer|gio|ven|sab|dom)\b/i,/\b\d{1,2}\s+(gen|feb|mar|apr|mag|giu|lug|ago|set|ott|nov|dic)/i];
  return patterns.some(p=>p.test(text));
}
function layoutEvents(evs){
  const sorted=[...evs].sort((a,b)=>a.start-b.start);const cols=[];
  const res=sorted.map(ev=>{for(let c=0;c<cols.length;c++)if(cols[c].end<=ev.start){cols[c]={end:ev.end};return{ev,col:c};}cols.push({end:ev.end});return{ev,col:cols.length-1};});
  return res.map(({ev,col})=>({ev,col,numCols:cols.length}));
}
function cleanObj(obj){
  if(Array.isArray(obj))return obj.map(cleanObj);
  if(obj&&typeof obj==="object"){const o={};for(const[k,v]of Object.entries(obj)){if(typeof v!=="function"&&!k.startsWith("_"))o[k]=cleanObj(v);}return o;}
  return obj;
}

// ── BACKUP (Firebase Storage) ─────────────────────────────────────────────────
async function fsCreateBackup(avvisi,tutors,tutEvents,anagraficaAv){
  const data={version:4,exportedAt:new Date().toISOString(),anagraficaAv,avvisi,tutors,tutEvents};
  const json=JSON.stringify(data,null,2);
  const ts=new Date().toISOString().replace(/[:.]/g,"-");
  const ref=storage.ref(`backups/backup_${ts}.json`);
  await ref.putString(json,"raw",{contentType:"application/json"});
  return`backup_${ts}.json`;
}
async function fsListBackups(){
  try{
    const res=await storage.ref("backups").listAll();
    const items=await Promise.all(res.items.map(async r=>{
      const meta=await r.getMetadata();
      const url=await r.getDownloadURL();
      return{name:r.name,fullPath:r.fullPath,url,size:meta.size,created:new Date(meta.timeCreated)};
    }));
    return items.sort((a,b)=>b.created-a.created);
  }catch(e){console.error(e);return[];}
}
async function fsDeleteBackup(fullPath){await storage.ref(fullPath).delete();}
async function fsApplyBackupPolicy(backups){
  // Policy: 7 giornalieri, 4 settimanali, 12 mensili
  const now=new Date();
  const keep=new Set();
  const byDay={},byWeek={},byMonth={};
  backups.forEach(b=>{
    const d=b.created;
    const dk=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    const wk=`${d.getFullYear()}-W${Math.floor(d.getDate()/7)}`;
    const mk=`${d.getFullYear()}-${d.getMonth()}`;
    if(!byDay[dk])byDay[dk]=b;
    if(!byWeek[wk])byWeek[wk]=b;
    if(!byMonth[mk])byMonth[mk]=b;
  });
  const diffDays=b=>Math.floor((now-b.created)/(1000*60*60*24));
  backups.forEach(b=>{
    const dd=diffDays(b);
    const dk=`${b.created.getFullYear()}-${b.created.getMonth()}-${b.created.getDate()}`;
    const wk=`${b.created.getFullYear()}-W${Math.floor(b.created.getDate()/7)}`;
    const mk=`${b.created.getFullYear()}-${b.created.getMonth()}`;
    if(dd<=7&&byDay[dk]?.name===b.name)keep.add(b.name);
    else if(dd<=28&&byWeek[wk]?.name===b.name)keep.add(b.name);
    else if(dd<=365&&byMonth[mk]?.name===b.name)keep.add(b.name);
  });
  for(const b of backups){if(!keep.has(b.name))try{await fsDeleteBackup(b.fullPath);}catch(e){console.error(e);}}
}

    for(const mk of Object.keys(bm)){const kept=bm[mk].filter(()=>Math.random()>0.15).slice(0,spm);for(const s of kept)events.push({id:`ave-demo-${ai}-${ei++}`,month:s.mk,day:s.day,start:sH,end:eH,ore:sessH});}
    return{id:ana.id,events};
  });
  const tutEvents={};
  anagraficaAv.forEach((ana,ai)=>{
    const av=avvisi[ai],sH=avStartH[ai],sessH=avEndH[ai]-sH;
    const tutH=Math.max(0.5,Math.round(sessH*0.28*2)/2);
    const pair=ai%2===0?[0,1]:[2,3];
    for(let ti=0;ti<2;ti++){
      const tId=tutors[pair[ti]].id;
      if(!tutEvents[tId])tutEvents[tId]={};
      const bm={};for(const e of av.events){if(!bm[e.month])bm[e.month]=[];bm[e.month].push(e);}
      for(const[mk,evs]of Object.entries(bm)){
        if(!tutEvents[tId][mk])tutEvents[tId][mk]=[];
        const n=Math.max(1,Math.round(evs.length*0.15));
        const st=ti*Math.floor(evs.length/2);
        evs.slice(st,st+n).forEach((e,j)=>{tutEvents[tId][mk].push({id:`tut-demo-${ai}-${ti}-${mk}-${j}`,day:e.day,name:ana.nome,start:sH,end:sH+tutH,ore:tutH,tutorId:tId});});
      }
    }
  });
  return{tutors,anagraficaAv,avvisi,tutEvents};
}

function ResizablePanel({children,defaultWidth=400,minWidth=320}){
  const[width,setWidth]=useState(defaultWidth);
  const dr=useRef(false);
  const max=Math.round(window.innerWidth*0.70);
  function onMD(e){e.preventDefault();dr.current=true;const sx=e.clientX,sw=width;
    function mv(me){if(!dr.current)return;setWidth(Math.max(minWidth,Math.min(max,sw+(sx-me.clientX))));}
    function up(){dr.current=false;document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);}
    document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);}
  return(<div style={{width,background:"#fff",boxShadow:"-4px 0 24px rgba(0,0,0,0.18)",display:"flex",flexDirection:"row",flexShrink:0}}>

// ── DRAG HOOK ─────────────────────────────────────────────────────────────────
function useDrag({onDragEnd,onClick}){
  const dragRef=useRef(null),resizeRef=useRef(null);
  const dragging=useRef(false),t0=useRef(0),p0=useRef({x:0,y:0});
  function makeBody(ev,slotH,colW){
    return function onDown(e){
      if(resizeRef.current&&e.target===resizeRef.current)return;
      e.stopPropagation();t0.current=Date.now();p0.current={x:e.clientX,y:e.clientY};dragging.current=false;
      const os=ev.start,oe=ev.end,od=ev.day;
      function onMove(me){const dx=Math.abs(me.clientX-p0.current.x),dy=Math.abs(me.clientY-p0.current.y),dt=Date.now()-t0.current;if(!dragging.current&&(dx>DRAG_PX||dy>DRAG_PX||dt>DRAG_MS))dragging.current=true;if(!dragging.current)return;const ns=Math.max(8,Math.min(19.75,snapH(os+(me.clientY-p0.current.y)/slotH)));const dd=Math.round((me.clientX-p0.current.x)/colW);if(dragRef.current){dragRef.current.style.top=`${(ns-8)*slotH}px`;dragRef.current.style.transform=`translateX(${dd*colW}px)`;}}
      function onUp(me){document.removeEventListener("mousemove",onMove);document.removeEventListener("mouseup",onUp);const dx=Math.abs(me.clientX-p0.current.x),dy=Math.abs(me.clientY-p0.current.y),dt=Date.now()-t0.current;if(dt<DRAG_MS&&dx<=DRAG_PX&&dy<=DRAG_PX){if(dragRef.current)dragRef.current.style.transform="";onClick&&onClick();return;}markDrag();const ns=Math.max(8,Math.min(19.75,snapH(os+(me.clientY-p0.current.y)/slotH)));const ne=Math.min(20,ns+(oe-os));const nd=Math.max(1,od+Math.round((me.clientX-p0.current.x)/colW));if(dragRef.current)dragRef.current.style.transform="";if(ns!==os||ne!==oe||nd!==od)onDragEnd({start:ns,end:ne,day:nd});}
      document.addEventListener("mousemove",onMove);document.addEventListener("mouseup",onUp);
    };
  }
  function makeResize(ev,slotH){
    return function onDown(e){e.stopPropagation();e.preventDefault();const sy=e.clientY,oe=ev.end,os=ev.start;
      function onMove(me){const ne=Math.max(os+0.25,Math.min(20,snapH(oe+(me.clientY-sy)/slotH)));if(dragRef.current)dragRef.current.style.height=`${Math.max((ne-os)*slotH,20)}px`;}
      function onUp(me){document.removeEventListener("mousemove",onMove);document.removeEventListener("mouseup",onUp);markDrag();const ne=Math.max(os+0.25,Math.min(20,snapH(oe+(me.clientY-sy)/slotH)));if(ne!==oe)onDragEnd({end:ne,ore:ne-os});}
      document.addEventListener("mousemove",onMove);document.addEventListener("mouseup",onUp);
    };
  }
  return{dragRef,resizeRef,makeBody,makeResize};
}

// ── VERIFICA ──────────────────────────────────────────────────────────────────
function runVerifica(avvisi,anagraficaAv,tutors,tutEvents){
  const errors=[];
  const avById={};avvisi.forEach(av=>avById[av.id]=av);
  const avByName={};anagraficaAv.forEach(a=>{if(avById[a.id])avByName[a.nome]=avById[a.id];});
  for(const[tid,months]of Object.entries(tutEvents)){for(const[mk,evs]of Object.entries(months)){for(const ev of evs){if(!avByName[ev.name]){const t=tutors.find(x=>x.id===tid);errors.push({type:"orfano",monthKey:mk,msg:`Tutor "${t?.cognome} ${t?.nome}": slot sull'avviso "${ev.name}" non presente in anagrafica (${mk}, giorno ${ev.day}).`});}}}}
  for(const[tid,months]of Object.entries(tutEvents)){for(const[mk,evs]of Object.entries(months)){for(const ev of evs){const av=avByName[ev.name];if(!av)continue;const avDay=av.events.find(e=>e.month===mk&&e.day===ev.day);const t=tutors.find(x=>x.id===tid);if(!avDay)errors.push({type:"fuori_giorno",monthKey:mk,msg:`Tutor "${t?.cognome} ${t?.nome}": slot "${ev.name}" il ${ev.day} ${mk} non corrisponde ad alcuna sessione dell'avviso.`});else if(ev.start<avDay.start||ev.end>avDay.end)errors.push({type:"fuori_orario",monthKey:mk,msg:`Tutor "${t?.cognome} ${t?.nome}": slot "${ev.name}" il ${ev.day} ${mk} (${fmt(ev.start)}–${fmt(ev.end)}) fuori orario avviso (${fmt(avDay.start)}–${fmt(avDay.end)}).`});}}}
  for(const[tid,months]of Object.entries(tutEvents)){for(const[mk,evs]of Object.entries(months)){const t=tutors.find(x=>x.id===tid);for(let i=0;i<evs.length;i++)for(let j=i+1;j<evs.length;j++){const a=evs[i],b=evs[j];if(a.day===b.day&&a.start<b.end&&b.start<a.end)errors.push({type:"sovrapposizione",monthKey:mk,msg:`Tutor "${t?.cognome} ${t?.nome}": sovrapposizione il ${a.day} ${mk} tra "${a.name}" e "${b.name}".`});}}}
  for(const ana of anagraficaAv){const av=avById[ana.id];const totAv=av?av.events.reduce((s,e)=>s+(e.ore||0),0):0;let totTut=0;for(const[,ms]of Object.entries(tutEvents))for(const[,evs]of Object.entries(ms))for(const ev of evs)if(ev.name===ana.nome)totTut+=(ev.ore||0);if(totTut>totAv)errors.push({type:"eccedenza",monthKey:null,msg:`Avviso "${ana.nome}": ore tutoraggio (${totTut}h) superano ore avviso nel calendario (${totAv}h).`});if(ana.durataOre){const tot=totAv;if(tot!==ana.durataOre)errors.push({type:"durata",monthKey:null,msg:`Avviso "${ana.nome}": ore nel calendario (${tot}h) ≠ durata da bando (${ana.durataOre}h).`});}}
  for(const[tid,months]of Object.entries(tutEvents)){const t=tutors.find(x=>x.id===tid);for(const[mk,evs]of Object.entries(months)){const dayOre={};for(const ev of evs)dayOre[ev.day]=(dayOre[ev.day]||0)+(ev.ore||0);for(const[day,ore]of Object.entries(dayOre)){if(ore>8)errors.push({type:"ore_giornaliere",monthKey:mk,msg:`Tutor "${t?.cognome} ${t?.nome}": ${ore}h il giorno ${day} ${mk} (limite 8h/giorno).`});}}}
  return errors;
}

function AiPanel({tutors,anagraficaAv,settings,user,isSuperAdmin,onAddTut,onAddAv,onOpenTutorPanel,onOpenAvPanel,onClose}){
  const[step,setStep]=useState("start");const[importType,setImportType]=useState(null);const[selTutor,setSelTutor]=useState("");const[selAv,setSelAv]=useState("");const[pending,setPending]=useState([]);const[ambig,setAmbig]=useState([]);const[loading,setLoading]=useState(false);const[showPaste,setShowPaste]=useState(false);const[pasteText,setPasteText]=useState("");
  const[messages,setMessages]=useState([{role:"ai",text:"Cosa vuoi importare?",buttons:[{label:"📌 Tutoraggi",value:"tutoraggio"},{label:"📋 Avviso/Progetto",value:"avviso"}]}]);
  const[size,setSize]=useState({w:Math.min(window.innerWidth*0.33,520),h:Math.min(window.innerHeight*0.44,400)});
  const fileRef=useRef(),btmRef=useRef(),panelRef=useRef();
  const uname=user?.email?.split("@")[0]||"utente";
  const phrase=useRef(FUNNY_PHRASES[Math.floor(Math.random()*FUNNY_PHRASES.length)]).current;
  useEffect(()=>{btmRef.current?.scrollIntoView({behavior:"smooth"});},[messages]);
  const addMsg=m=>setMessages(p=>[...p,m]);

  // Resize handles
  function makeResizeHandler(dir){
    return function(e){
      e.preventDefault();const sx=e.clientX,sy=e.clientY,sw=size.w,sh=size.h;
      function mv(me){
        if(dir==="right"||dir==="corner")setSize(s=>({...s,w:Math.max(300,sw+(me.clientX-sx))}));
        if(dir==="top"||dir==="corner")setSize(s=>({...s,h:Math.max(250,sh-(me.clientY-sy))}));
      }
      function up(){document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up);}
      document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up);
    };
  }

  function startImport(type){setImportType(type);if(type==="tutoraggio"){if(!tutors.length){addMsg({role:"ai",text:"⚠️ Nessun tutor in anagrafica.",showOpenTutor:true});return;}addMsg({role:"ai",text:"Hai già inserito il tutor in anagrafica?",showTutorCheck:true});}else{if(!anagraficaAv.length){addMsg({role:"ai",text:"⚠️ Nessun avviso in anagrafica.",showOpenAv:true});return;}addMsg({role:"ai",text:"Hai già inserito l'Avviso/Progetto in anagrafica?",showAvCheck:true});}}
  function proceedTutor(){setStep("selTutor");addMsg({role:"ai",text:"Seleziona tutor e avviso, poi carica il documento o incolla il testo.",showTutorSel:true});}
  function proceedAv(){setStep("selAv");addMsg({role:"ai",text:"Seleziona l'avviso/progetto, poi carica il documento o incolla il testo.",showAvSel:true});}

  async function processFile(file){
    addMsg({role:"user",text:`📎 ${file.name}`});setLoading(true);addMsg({role:"ai",text:"Analisi in corso...",isLoading:true});
    try{const res=await analyzeDoc(file,null);handleResult(res);}catch(err){setMessages(p=>p.filter(m=>!m.isLoading));addMsg({role:"ai",text:`Errore: ${err.message}`});}
    setLoading(false);
  }
  async function processPaste(){
    if(!pasteText.trim()){addMsg({role:"ai",text:"⚠️ Testo vuoto."});return;}
    if(!looksLikeCalendar(pasteText)){addMsg({role:"ai",text:"⚠️ Il testo incollato non sembra contenere date o orari. Questa funzione supporta solo l'importazione di calendari con date e orari."});setPasteText("");setShowPaste(false);return;}
    addMsg({role:"user",text:`📋 Testo incollato (${pasteText.length} caratteri)`});setShowPaste(false);setPasteText("");setLoading(true);addMsg({role:"ai",text:"Analisi in corso...",isLoading:true});
    try{const res=await analyzeDoc(null,pasteText);handleResult(res);}catch(err){setMessages(p=>p.filter(m=>!m.isLoading));addMsg({role:"ai",text:`Errore: ${err.message}`});}
    setLoading(false);
  }
  function handleResult(res){
    setMessages(p=>p.filter(m=>!m.isLoading));
    if(res.ambiguities?.length>0){setAmbig(res.ambiguities);setPending(res.events||[]);setStep("ambiguity");addMsg({role:"ai",text:`${res.events?.length||0} appuntamenti, chiarimenti necessari:`,showAmbiguities:res.ambiguities});}
    else if(res.events?.length>0){setPending(res.events);setStep("preview");addMsg({role:"ai",text:`${res.events.length} appuntamenti trovati. Confermi?`,showPreview:res.events});}
    else addMsg({role:"ai",text:"Nessun appuntamento trovato.",showUpload:true});
  }

  async function analyzeDoc(file,text){
    const prov=settings.aiProvider||"gemini";
    const prompt=`Estrai appuntamenti da questo documento/testo. Rispondi SOLO con JSON:\n{"events":[{"day":8,"month":"mag-26","start":9.5,"end":13.5,"ore":4,"name":"nome"}],"ambiguities":[]}\nRegole: month=mmm-yy, start/end decimali, ore=durata.`;
    if(prov==="gemini"){
      if(!settings.geminiApiKey)throw new Error("Chiave Gemini non configurata.");
      let parts;
      if(text){parts=[{text:`${prompt}\n\n${text}`}];}
      else{const b64=await toB64(file);const mime=file.type||"application/octet-stream";const isPdf=mime==="application/pdf",isImg=mime.startsWith("image/");parts=isPdf||isImg?[{inline_data:{mime_type:mime,data:b64}},{text:prompt}]:[{text:`${prompt}\n\n${atob(b64)}`}];}
      const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${settings.geminiApiKey}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts}]})});
      if(!r.ok){const j=await r.json();throw new Error(r.status===429?"Quota Gemini esaurita.":r.status===401?"Chiave Gemini non valida.":`Errore ${r.status}: ${j.error?.message||""}`);}
      const d=await r.json();return parseR(d.candidates?.[0]?.content?.parts?.[0]?.text||"{}");
    }else{
      if(!settings.openaiApiKey)throw new Error("Chiave OpenAI non configurata.");
      let msgs;
      if(text){msgs=[{role:"user",content:`${prompt}\n\n${text}`}];}
      else{const b64=await toB64(file);const mime=file.type||"application/octet-stream";const isImg=mime.startsWith("image/");msgs=isImg?[{role:"user",content:[{type:"text",text:prompt},{type:"image_url",image_url:{url:`data:${mime};base64,${b64}`}}]}]:[{role:"user",content:`${prompt}\n\n${mime==="application/pdf"?"[PDF]":atob(b64)}`}];}
      const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${settings.openaiApiKey}`},body:JSON.stringify({model:pickOpenAiModel(),messages:msgs,max_tokens:2000})});
      if(!r.ok)throw new Error(r.status===429?"Quota OpenAI esaurita.":r.status===401?"Chiave OpenAI non valida.":`Errore ${r.status}`);
      const d=await r.json();return parseR(d.choices?.[0]?.message?.content||"{}");
    }
  }
  function toB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});}
  function parseR(t){try{return JSON.parse(t.replace(/```json|```/g,"").trim());}catch{const m=t.match(/\{[\s\S]*\}/);if(m)return JSON.parse(m[0]);throw new Error("Risposta AI non valida");}}

  async function onFile(e){const file=e.target.files[0];if(!file)return;e.target.value="";if(importType==="tutoraggio"&&(!selTutor||!selAv)){addMsg({role:"ai",text:"⚠️ Seleziona prima tutor e avviso."});return;}if(importType==="avviso"&&!selAv){addMsg({role:"ai",text:"⚠️ Seleziona prima un avviso/progetto."});return;}await processFile(file);}

  async function onConfirm(){setLoading(true);try{if(importType==="tutoraggio"){const avName=anagraficaAv.find(a=>a.id===selAv)?.nome||"";for(const ev of pending)await onAddTut({day:ev.day,name:avName,start:ev.start,end:ev.end,ore:ev.ore,tutorId:selTutor},ev.month);}else{const events=pending.map((ev,i)=>({id:`ave-${Date.now()}-${i}`,month:ev.month,day:ev.day,start:ev.start,end:ev.end,ore:ev.ore}));await onAddAv({id:selAv,events});}setStep("done");addMsg({role:"ai",text:`✅ Importati ${pending.length} appuntamenti!`});}catch(err){addMsg({role:"ai",text:`Errore: ${err.message}`});}setLoading(false);}

  const uploadButtons=(showPasteBtn)=>(<div style={{display:"flex",gap:6,flexDirection:"column",width:"100%",marginTop:6}}>
    <button onClick={()=>fileRef.current.click()} style={{width:"100%",padding:"7px",borderRadius:10,border:"2px dashed #4f86c6",background:"#f0f6ff",color:"#4f86c6",cursor:"pointer",fontWeight:700,fontSize:12}}>📎 Carica documento</button>
    {showPasteBtn&&<button onClick={()=>setShowPaste(s=>!s)} style={{width:"100%",padding:"7px",borderRadius:10,border:"2px dashed #27ae60",background:"#f0fff4",color:"#27ae60",cursor:"pointer",fontWeight:700,fontSize:12}}>📋 Incolla testo</button>}
    {showPaste&&<div style={{marginTop:4}}><textarea value={pasteText} onChange={e=>setPasteText(e.target.value)} placeholder="Incolla qui il testo con le date (es. da Excel o PDF)..." style={{width:"100%",height:90,padding:"8px",borderRadius:8,border:"1px solid #27ae60",fontSize:12,resize:"vertical",boxSizing:"border-box"}}/><button onClick={processPaste} disabled={loading||!pasteText.trim()} style={{width:"100%",padding:"6px",borderRadius:8,border:"none",background:"#27ae60",color:"#fff",cursor:"pointer",fontWeight:700,fontSize:12,marginTop:4}}>Analizza testo</button></div>}
  </div>);

  function renderMsg(msg,idx){const isAi=msg.role==="ai";return(<div key={idx} style={{display:"flex",flexDirection:"column",alignItems:isAi?"flex-start":"flex-end",marginBottom:10}}>
    <div style={{maxWidth:"90%",padding:"9px 13px",borderRadius:isAi?"4px 14px 14px 14px":"14px 4px 14px 14px",background:isAi?"#f0f4f8":"#4f86c6",color:isAi?"#1a3a5c":"#fff",fontSize:13,lineHeight:1.5}}>{msg.isLoading?<span style={{opacity:0.6}}>⏳ {msg.text}</span>:<span>{msg.text}</span>}</div>
    {msg.buttons&&<div style={{display:"flex",gap:8,marginTop:6,flexWrap:"wrap"}}>{msg.buttons.map(b=><button key={b.value} onClick={()=>{addMsg({role:"user",text:b.label});startImport(b.value);}} style={{padding:"7px 14px",borderRadius:20,border:"2px solid #4f86c6",background:"#fff",color:"#4f86c6",cursor:"pointer",fontWeight:700,fontSize:12}}>{b.label}</button>)}</div>}
    {msg.showOpenTutor&&<button onClick={onOpenTutorPanel} style={{marginTop:6,padding:"7px 14px",borderRadius:10,border:"2px solid #4f86c6",background:"#f0f6ff",color:"#4f86c6",cursor:"pointer",fontWeight:700,fontSize:12}}>👤 Apri Anagrafica Tutor</button>}
    {msg.showOpenAv&&<button onClick={onOpenAvPanel} style={{marginTop:6,padding:"7px 14px",borderRadius:10,border:"2px solid #4f86c6",background:"#f0f6ff",color:"#4f86c6",cursor:"pointer",fontWeight:700,fontSize:12}}>📋 Apri Anagrafica Avvisi</button>}
    {msg.showTutorCheck&&<div style={{display:"flex",gap:8,marginTop:6}}><button onClick={proceedTutor} style={{padding:"7px 14px",borderRadius:12,border:"2px solid #27ae60",background:"#fff",color:"#27ae60",cursor:"pointer",fontWeight:700,fontSize:12}}>✅ Sì, procedi</button><button onClick={()=>addMsg({role:"ai",text:"Aggiungilo prima:",showOpenTutor:true})} style={{padding:"7px 14px",borderRadius:12,border:"2px solid #e07b39",background:"#fff",color:"#e07b39",cursor:"pointer",fontWeight:700,fontSize:12}}>➕ No, aggiungi</button></div>}
    {msg.showAvCheck&&<div style={{display:"flex",gap:8,marginTop:6}}><button onClick={proceedAv} style={{padding:"7px 14px",borderRadius:12,border:"2px solid #27ae60",background:"#fff",color:"#27ae60",cursor:"pointer",fontWeight:700,fontSize:12}}>✅ Sì, procedi</button><button onClick={()=>addMsg({role:"ai",text:"Aggiungilo prima:",showOpenAv:true})} style={{padding:"7px 14px",borderRadius:12,border:"2px solid #e07b39",background:"#fff",color:"#e07b39",cursor:"pointer",fontWeight:700,fontSize:12}}>➕ No, aggiungi</button></div>}
    {msg.showTutorSel&&step==="selTutor"&&<div style={{marginTop:8,width:"100%"}}>
      <select value={selTutor} onChange={e=>setSelTutor(e.target.value)} style={{width:"100%",padding:"7px 10px",borderRadius:8,border:"1px solid #4f86c6",fontSize:13,marginBottom:6}}><option value="">— Seleziona tutor —</option>{tutors.map(t=><option key={t.id} value={t.id}>{t.cognome} {t.nome}</option>)}</select>
      {selTutor&&(()=>{const t=tutors.find(x=>x.id===selTutor);return t?<div style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",borderRadius:8,background:hexToRgba(t.color||"#4f86c6",0.12),border:`1px solid ${hexToRgba(t.color||"#4f86c6",0.3)}`,marginBottom:8}}><div style={{width:12,height:12,borderRadius:3,background:t.color||"#4f86c6",flexShrink:0}}/><span style={{fontSize:12,fontWeight:700,color:"#1a3a5c"}}>✓ {t.cognome} {t.nome}</span>{t.azienda&&<span style={{fontSize:11,color:"#888"}}>· {t.azienda}</span>}</div>:null;})()}
      <select value={selAv} onChange={e=>setSelAv(e.target.value)} style={{width:"100%",padding:"7px 10px",borderRadius:8,border:"1px solid #4f86c6",fontSize:13,marginBottom:6}}><option value="">— Seleziona avviso/progetto —</option>{anagraficaAv.map(a=><option key={a.id} value={a.id}>{a.nome}</option>)}</select>
      {selAv&&(()=>{const a=anagraficaAv.find(x=>x.id===selAv);return a?<div style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",borderRadius:8,background:hexToRgba(a.colore||"#4f86c6",0.10),border:`1px solid ${hexToRgba(a.colore||"#4f86c6",0.3)}`,marginBottom:8}}><div style={{width:12,height:12,borderRadius:3,background:a.colore||"#4f86c6",flexShrink:0}}/><span style={{fontSize:12,fontWeight:700,color:"#1a3a5c"}}>✓ {a.nome}</span>{a.durataOre&&<span style={{fontSize:11,color:"#888"}}>· {a.durataOre}h</span>}{a.stato&&<span style={{fontSize:11,color:"#888"}}>· {a.stato}</span>}</div>:null;})()}
      {(!selTutor||!selAv)?<div style={{fontSize:11,color:"#aaa",fontStyle:"italic",padding:"4px 0"}}>Seleziona tutor e avviso per procedere.</div>:uploadButtons(true)}
    </div>}
    {msg.showAvSel&&step==="selAv"&&<div style={{marginTop:8,width:"100%"}}>
      <select value={selAv} onChange={e=>setSelAv(e.target.value)} style={{width:"100%",padding:"7px 10px",borderRadius:8,border:"1px solid #4f86c6",fontSize:13,marginBottom:6}}><option value="">— Seleziona avviso/progetto —</option>{anagraficaAv.map(a=><option key={a.id} value={a.id}>{a.nome}</option>)}</select>
      {selAv&&(()=>{const a=anagraficaAv.find(x=>x.id===selAv);return a?<div style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",borderRadius:8,background:hexToRgba(a.colore||"#4f86c6",0.10),border:`1px solid ${hexToRgba(a.colore||"#4f86c6",0.3)}`,marginBottom:8}}><div style={{width:12,height:12,borderRadius:3,background:a.colore||"#4f86c6",flexShrink:0}}/><span style={{fontSize:12,fontWeight:700,color:"#1a3a5c"}}>✓ {a.nome}</span>{a.durataOre&&<span style={{fontSize:11,color:"#888"}}>· {a.durataOre}h</span>}{a.stato&&<span style={{fontSize:11,color:"#888"}}>· {a.stato}</span>}</div>:null;})()}
      {!selAv?<div style={{fontSize:11,color:"#aaa",fontStyle:"italic",padding:"4px 0"}}>Seleziona un avviso per procedere.</div>:uploadButtons(true)}
    </div>}
    {msg.showUpload&&uploadButtons(true)}
    {msg.showPreview&&<div style={{marginTop:6,width:"100%"}}><div style={{maxHeight:130,overflowY:"auto",border:"1px solid #dde",borderRadius:8,background:"#fff",marginBottom:8}}>{msg.showPreview.map((ev,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"4px 10px",borderBottom:"1px solid #f0f0f0",fontSize:11}}><span style={{color:"#555"}}>{ev.day} {ev.month} — {fmt(ev.start)}–{fmt(ev.end)}</span><span style={{fontWeight:600,color:"#1a3a5c"}}>{ev.ore}h</span></div>)}</div>{step==="preview"&&<div style={{display:"flex",gap:6}}><button onClick={onConfirm} disabled={loading} style={{flex:1,padding:"8px",borderRadius:8,border:"none",background:"#2ecc71",color:"#fff",cursor:"pointer",fontWeight:700,fontSize:12}}>{loading?"Importazione...":"✓ Conferma tutto"}</button><button onClick={()=>{setStep(importType==="tutoraggio"?"selTutor":"selAv");addMsg({role:"ai",text:"Ok, carica un altro file o incolla del testo.",showUpload:true});}} style={{padding:"8px 12px",borderRadius:8,border:"1px solid #ccc",background:"#f5f5f5",cursor:"pointer",fontSize:12}}>✕</button></div>}</div>}
    {msg.showAmbiguities&&<div style={{marginTop:6,width:"100%"}}>{msg.showAmbiguities.map((a,i)=><div key={i} style={{padding:"8px 10px",marginBottom:4,borderRadius:8,border:"1px solid #f0c040",background:"#fffbea",fontSize:11}}><div style={{fontWeight:700,color:"#b8860b",marginBottom:3}}>⚠️ {a.field}</div><div style={{color:"#555",marginBottom:5}}>{a.description}</div><button onClick={()=>{const rem=ambig.filter((_,j)=>j!==i);setAmbig(rem);if(!rem.length){setStep("preview");addMsg({role:"ai",text:"Grazie! Ecco il riepilogo:",showPreview:pending});}}} style={{padding:"3px 9px",borderRadius:6,border:"none",background:"#4f86c6",color:"#fff",cursor:"pointer",fontSize:11,fontWeight:600}}>✓ Confermo</button></div>)}</div>}
  </div>);}

  const rHandleStyle={position:"absolute",background:"transparent",zIndex:10};
  return(<div ref={panelRef} style={{position:"fixed",bottom:0,left:0,width:size.w,zIndex:500,background:"#fff",boxShadow:"4px -4px 24px rgba(0,0,0,0.18)",display:"flex",flexDirection:"column",height:size.h,borderRadius:"0 14px 0 0",border:"2px solid #1a3a5c",borderBottom:"none",borderLeft:"none"}}>
    {/* Top resize handle */}
    <div onMouseDown={makeResizeHandler("top")} style={{...rHandleStyle,top:-4,left:0,right:20,height:8,cursor:"ns-resize"}}/>
    {/* Right resize handle */}
    <div onMouseDown={makeResizeHandler("right")} style={{...rHandleStyle,top:0,right:-4,bottom:0,width:8,cursor:"ew-resize"}}/>
    {/* Corner handle */}
    <div onMouseDown={makeResizeHandler("corner")} style={{...rHandleStyle,top:-4,right:-4,width:12,height:12,cursor:"nwse-resize",background:"#4f86c6",borderRadius:"0 4px 0 0",opacity:0.6}}/>
    <div style={{background:"linear-gradient(135deg,#1a3a5c,#2980b9)",color:"#fff",padding:"10px 14px",display:"flex",flexDirection:"column",gap:5,flexShrink:0,borderRadius:"0 12px 0 0"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}><span style={{fontWeight:800,fontSize:16}}>🤖 Ciao, {uname}!</span><button onClick={onClose} style={{background:"none",border:"none",color:"#fff",fontSize:20,cursor:"pointer",lineHeight:1}}>✕</button></div>
      <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontWeight:700,fontSize:13,opacity:0.92,flex:1,lineHeight:1.35}}>{phrase}</span>{isSuperAdmin&&<button style={{background:"rgba(255,150,50,0.25)",border:"1.5px solid rgba(255,150,50,0.6)",color:"#ffb347",borderRadius:8,padding:"3px 10px",cursor:"not-allowed",fontSize:12,fontWeight:700,flexShrink:0,whiteSpace:"nowrap"}} title="In arrivo 🚀">💪 God Mode</button>}</div>
    </div>
    <div style={{flex:1,overflowY:"auto",padding:"10px 14px",display:"flex",flexDirection:"column"}}>{messages.map((m,i)=>renderMsg(m,i))}<div ref={btmRef}/></div>
    <input ref={fileRef} type="file" accept=".pdf,.jpg,.jpeg,.png,.csv,.doc,.docx,.txt" style={{display:"none"}} onChange={onFile}/>
  </div>);
}

// ── ADD/EDIT MODAL ────────────────────────────────────────────────────────────
function AddModal({mode,prefill,currentMonthIdx,avvisi,anagraficaAv,tutors,editTarget,onAddTut,onEditTut,onDeleteTut,onAddAv,onEditAv,onDeleteAv,onClose,onOpenTutorPanel,onOpenAvPanel}){
  const isEdit=!!editTarget;
  const[tab,setTab]=useState(mode==="avviso"?"avviso":"tutoraggio");
  const[tutTutor,setTutTutor]=useState(isEdit&&editTarget.type==="tutoraggio"?(editTarget.ev.tutorId||tutors[0]?.id||""):(tutors[0]?.id||""));
  const[tutAvId,setTutAvId]=useState(()=>{if(isEdit&&editTarget.type==="tutoraggio"){const a=anagraficaAv.find(x=>x.nome===editTarget.ev.name);return a?.id||"";}return anagraficaAv[0]?.id||"";});
  const[tutDay,setTutDay]=useState(isEdit&&editTarget.type==="tutoraggio"?editTarget.ev.day:(prefill?.day||1));
  const[tutMonthIdx,setTutMonthIdx]=useState(currentMonthIdx);
  const[tutStart,setTutStart]=useState(hToTimeStr(isEdit&&editTarget.type==="tutoraggio"?editTarget.ev.start:(prefill?.start||9)));
  const[tutEnd,setTutEnd]=useState(hToTimeStr(isEdit&&editTarget.type==="tutoraggio"?editTarget.ev.end:(prefill?.end||10)));
  const[avId,setAvId]=useState(isEdit&&editTarget.type==="avviso"?editTarget.avviso.id:(anagraficaAv[0]?.id||""));
  const[avDay,setAvDay]=useState(isEdit&&editTarget.type==="avviso"?editTarget.ev.day:(prefill?.day||1));
  const[avMonthIdx,setAvMonthIdx]=useState(currentMonthIdx);
  const[avStart,setAvStart]=useState(hToTimeStr(isEdit&&editTarget.type==="avviso"?editTarget.ev.start:(prefill?.start||9)));
  const[avEnd,setAvEnd]=useState(hToTimeStr(isEdit&&editTarget.type==="avviso"?editTarget.ev.end:(prefill?.end||13)));
  const inp={display:"block",width:"100%",marginBottom:10,padding:"6px 8px",borderRadius:6,border:"1px solid #ccc",boxSizing:"border-box",fontSize:13};
  const tBtn=(t,l)=><button onClick={()=>setTab(t)} style={{flex:1,padding:"8px 0",border:"none",cursor:"pointer",fontWeight:600,fontSize:13,borderRadius:6,background:tab===t?"#4f86c6":"#f0f4f8",color:tab===t?"#fff":"#555"}}>{l}</button>;
  const selT=tutors.find(t=>t.id===tutTutor);const selAnaT=anagraficaAv.find(a=>a.id===tutAvId);const selAnaAv=anagraficaAv.find(a=>a.id===avId);
  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div style={{background:"#fff",borderRadius:14,padding:24,width:390,boxShadow:"0 8px 32px rgba(0,0,0,0.22)",maxHeight:"92vh",overflowY:"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><span style={{fontWeight:700,fontSize:15}}>{isEdit?"✏️ Modifica":"➕ Aggiungi"}</span><button onClick={onClose} style={{background:"none",border:"none",fontSize:18,cursor:"pointer",color:"#888"}}>✕</button></div>
      {!isEdit&&<div style={{display:"flex",gap:6,marginBottom:16}}>{tBtn("tutoraggio","📌 Tutoraggio")}{tBtn("avviso","📋 Avviso/Progetto")}</div>}
      {tab==="tutoraggio"&&(<>
        <label style={{fontSize:12,color:"#555",display:"block",marginBottom:3}}>Tutor</label>
        {tutors.length===0?<div style={{marginBottom:10,padding:"8px 10px",borderRadius:8,background:"#fff8f0",border:"1px solid #f0c080",fontSize:12,color:"#e07b39"}}>Nessun tutor. <button onClick={()=>{onClose();onOpenTutorPanel();}} style={{background:"none",border:"none",color:"#4f86c6",cursor:"pointer",fontWeight:700,textDecoration:"underline"}}>Aggiungi →</button></div>
        :<select value={tutTutor} onChange={e=>{if(e.target.value==="__open__"){onClose();onOpenTutorPanel();}else setTutTutor(e.target.value);}} style={inp}>{tutors.map(t=><option key={t.id} value={t.id}>{t.cognome} {t.nome}</option>)}<option value="__open__">+ Apri Anagrafica Tutor...</option></select>}
        {selT&&<div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,padding:"6px 10px",borderRadius:8,background:hexToRgba(selT.color||"#4f86c6",0.12)}}><div style={{width:14,height:14,borderRadius:3,background:selT.color||"#4f86c6"}}/><span style={{fontSize:12,color:"#555"}}>Colore tutor</span></div>}
        <label style={{fontSize:12,color:"#555",display:"block",marginBottom:3}}>Avviso/Progetto</label>
        {anagraficaAv.length===0?<div style={{marginBottom:10,padding:"8px 10px",borderRadius:8,background:"#fff8f0",border:"1px solid #f0c080",fontSize:12,color:"#e07b39"}}>Nessun avviso. <button onClick={()=>{onClose();onOpenAvPanel();}} style={{background:"none",border:"none",color:"#4f86c6",cursor:"pointer",fontWeight:700,textDecoration:"underline"}}>Aggiungi →</button></div>
        :<select value={tutAvId} onChange={e=>{if(e.target.value==="__open__"){onClose();onOpenAvPanel();}else setTutAvId(e.target.value);}} style={inp}>{anagraficaAv.map(a=><option key={a.id} value={a.id}>{a.nome}</option>)}<option value="__open__">+ Apri Anagrafica Avvisi...</option></select>}
        {selAnaT&&<div style={{marginBottom:10,padding:"8px 10px",borderRadius:8,background:hexToRgba(selAnaT.colore||"#4f86c6",0.08),border:`1px solid ${hexToRgba(selAnaT.colore||"#4f86c6",0.3)}`}}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}><div style={{width:12,height:12,borderRadius:3,background:selAnaT.colore||"#4f86c6"}}/><span style={{fontSize:12,fontWeight:600,color:"#1a3a5c"}}>{selAnaT.nome}</span></div><div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{selAnaT.durataOre&&<span style={{fontSize:11,color:"#888"}}>Durata: {selAnaT.durataOre}h</span>}{selAnaT.stato&&<span style={{fontSize:11,color:"#888"}}>Stato: {selAnaT.stato}</span>}</div></div>}
        <DayPicker initialMonthIdx={tutMonthIdx} value={tutDay} selectedMonthIdx={tutMonthIdx} onChange={(d,mIdx)=>{setTutDay(d);setTutMonthIdx(mIdx);}}/>
        <div style={{display:"flex",gap:10,marginBottom:14}}><TimePicker label="Inizio" value={tutStart} onChange={setTutStart}/><TimePicker label="Fine" value={tutEnd} onChange={setTutEnd}/></div>
        <div style={{display:"flex",gap:8,justifyContent:"space-between",alignItems:"center"}}>
          {isEdit&&<button onClick={()=>{if(confirm("Eliminare questo slot tutoraggio?")){onDeleteTut(editTarget.ev.id);onClose();}}} style={{padding:"7px 14px",borderRadius:6,border:"none",background:"#ffeaea",color:"#c0392b",cursor:"pointer",fontWeight:600,fontSize:12}}>🗑️ Elimina</button>}
          <div style={{display:"flex",gap:8,marginLeft:"auto"}}><button onClick={onClose} style={{padding:"7px 16px",borderRadius:6,border:"1px solid #ccc",background:"#f5f5f5",cursor:"pointer"}}>Annulla</button>
          <button onClick={()=>{const s=timeStrToH(tutStart),e=timeStrToH(tutEnd);if(!tutAvId||tutAvId==="__open__"||!tutTutor||e<=s)return;const ana=anagraficaAv.find(a=>a.id===tutAvId);const mk=MONTHS[tutMonthIdx].key;if(isEdit)onEditTut(editTarget.ev.id,{day:tutDay,name:ana?.nome,start:s,end:e,ore:e-s,tutorId:tutTutor},mk);else onAddTut({day:tutDay,name:ana?.nome,start:s,end:e,ore:e-s,tutorId:tutTutor},mk);onClose();}} style={{padding:"7px 16px",borderRadius:6,border:"none",background:"#4f86c6",color:"#fff",cursor:"pointer",fontWeight:600}}>{isEdit?"Salva":"Aggiungi"}</button></div>
        </div>
      </>)}
      {tab==="avviso"&&(<>
        <label style={{fontSize:12,color:"#555",display:"block",marginBottom:3}}>Avviso/Progetto</label>
        {anagraficaAv.length===0?<div style={{marginBottom:10,padding:"8px 10px",borderRadius:8,background:"#fff8f0",border:"1px solid #f0c080",fontSize:12,color:"#e07b39"}}>Nessun avviso. <button onClick={()=>{onClose();onOpenAvPanel();}} style={{background:"none",border:"none",color:"#4f86c6",cursor:"pointer",fontWeight:700,textDecoration:"underline"}}>Aggiungi →</button></div>

          <button onClick={()=>{const s=timeStrToH(avStart),e=timeStrToH(avEnd);if(e<=s||!avId||avId==="__open__")return;const ana=anagraficaAv.find(a=>a.id===avId);const mk=MONTHS[avMonthIdx].key;const evData={month:mk,day:avDay,start:s,end:e,ore:e-s};if(isEdit)onEditAv(editTarget.avviso.id,editTarget.ev.id,evData);else onAddAv({existingId:avId,name:ana?.nome,color:ana?.colore,...evData});onClose();}} style={{padding:"7px 16px",borderRadius:6,border:"none",background:"#4f86c6",color:"#fff",cursor:"pointer",fontWeight:600}}>{isEdit?"Salva":"Aggiungi"}</button></div>

    }).catch(()=>{});

      <input ref={importRef} type="file" accept=".json" style={{display:"none"}} onChange={handleImport}/>
      <span style={{fontWeight:700,fontSize:16}}>📅</span>
      <div style={{display:"flex",gap:4,background:"rgba(255,255,255,0.1)",borderRadius:10,padding:"3px"}}><button style={vBtn("tutoraggio")} onClick={()=>setView("tutoraggio")}>Calendario Tutoraggi</button><button style={vBtn("avviso")} onClick={()=>setView("avviso")}>Calendario Avvisi/Progetti</button></div>
      <button onClick={()=>setShowTutPanel2(true)} style={hBtn()}>📌 Riepilogo Tutoraggi</button>
      <button onClick={()=>setShowRiepilogoAv(true)} style={hBtn()}>📋 Riepilogo Avvisi/Progetti</button>
      <button onClick={()=>setShowRiep(true)} style={hBtn()}>📊 Riepilogo Ore</button>
      {!isViewer&&<button onClick={()=>setShowAi(o=>!o)} style={hBtn({background:showAi?"rgba(41,128,185,0.6)":"rgba(41,128,185,0.3)",border:"1.5px solid rgba(41,128,185,0.7)"})}>🤖 AI</button>}
      <button onClick={handleVerifica} style={hBtn({background:"rgba(46,204,113,0.25)",border:"1.5px solid rgba(46,204,113,0.6)"})}>✅ Verifica</button>
      {/* Modalità modifica */}
      {!isViewer&&<button onClick={()=>setEditMode(e=>!e)} style={hBtn({background:editMode?"rgba(231,76,60,0.5)":"rgba(255,255,255,0.12)",border:editMode?"1.5px solid rgba(231,76,60,0.8)":"1.5px solid rgba(255,255,255,0.3)"})}>{editMode?"🔒 Blocca":"✏️ Modifica"}</button>}
      {/* Undo */}
      {canEdit&&undoCount>0&&<button onClick={handleUndo} style={hBtn({background:"rgba(155,89,182,0.3)",border:"1.5px solid rgba(155,89,182,0.6)"})} title={`Annulla ultima operazione (${undoCount} disponibili)`}>↩ Annulla</button>}
      <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:12,opacity:0.6}}>{user?.email}</span><button onClick={()=>firebase.auth().signOut()} style={hBtn()}>Esci</button></div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <button onClick={()=>setMonthIdx(i=>Math.max(0,i-1))} disabled={monthIdx===0} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"#fff",borderRadius:6,padding:"5px 12px",cursor:"pointer",fontSize:16,opacity:monthIdx===0?0.4:1}}>‹</button>
        <span style={{fontWeight:600,minWidth:150,textAlign:"center"}}>{month.label}</span>
        <button onClick={()=>setMonthIdx(i=>Math.min(MONTHS.length-1,i+1))} disabled={monthIdx===MONTHS.length-1} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"#fff",borderRadius:6,padding:"5px 12px",cursor:"pointer",fontSize:16,opacity:monthIdx===MONTHS.length-1?0.4:1}}>›</button>
        {canEdit&&<button onClick={()=>setModal({type:"add",mode:view,prefill:{day:1,start:9,end:10}})} style={{background:"#4f86c6",border:"none",color:"#fff",borderRadius:6,padding:"6px 14px",cursor:"pointer",fontWeight:600}}>+ Aggiungi</button>}
      </div>
    </div>
    {!editMode&&!isViewer&&<div style={{background:"#fff8e0",borderBottom:"1px solid #f0c040",padding:"5px 20px",fontSize:12,color:"#b8860b",display:"flex",alignItems:"center",gap:8}}>👁 Modalità visualizzazione — clicca <strong>✏️ Modifica</strong> per apportare modifiche.</div>}
    {importErr&&<div style={{background:"#ffeaea",borderBottom:"1px solid #f5c6cb",padding:"6px 20px",fontSize:12,color:"#c0392b",display:"flex",justifyContent:"space-between"}}>⚠️ {importErr}<button onClick={()=>setImportErr("")} style={{background:"none",border:"none",cursor:"pointer",color:"#c0392b"}}>✕</button></div>}

    {view==="tutoraggio"&&(<div style={{background:"#fff",borderBottom:"1px solid #dde",flexShrink:0}}>
      <div style={{padding:"5px 20px",borderBottom:"1px solid #f0f0f0",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <span style={{fontWeight:700,color:"#1a3a5c",fontSize:13}}>🕐 {totTOre%1===0?totTOre:totTOre.toFixed(1)}h tutoraggio</span><span style={{color:"#ddd"}}>│</span>
        {tutors.length===0?<span style={{fontSize:11,color:"#ccc",fontStyle:"italic"}}>Nessun tutor</span>:tutors.map(t=>{const active=activeTutorIds===null||activeTutorIds.has(t.id),col=t.color||"#4f86c6";return<button key={t.id} onClick={()=>toggleTut(t.id)} style={{fontSize:11,padding:"3px 10px",borderRadius:20,cursor:"pointer",fontWeight:700,border:`2px solid ${col}`,background:active?col:"transparent",color:active?"#fff":col,opacity:active?1:0.5}}>{t.cognome||t.nome}</button>;})}
        <span style={{color:"#ddd"}}>│</span>
        <button onClick={()=>setShowOvr(o=>!o)} style={{fontSize:11,padding:"3px 12px",borderRadius:20,cursor:"pointer",fontWeight:700,border:"2px solid #e07b39",background:showOvr?"#e07b39":"transparent",color:showOvr?"#fff":"#e07b39"}}>{showOvr?"👁 Nascondi avvisi":"👁 Mostra avvisi"}</button>
      </div>
      <div style={{padding:"5px 20px",borderBottom:"1px solid #f0f0f0",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <span style={{fontSize:11,fontWeight:700,color:"#888",minWidth:120,flexShrink:0}}>Avvisi/Progetti</span><span style={{color:"#ddd",flexShrink:0}}>│</span>
        {avForBar.length===0?<span style={{fontSize:11,color:"#ccc",fontStyle:"italic"}}>Nessuno</span>:avForBar.map(a=><span key={a.id} style={{fontSize:11,padding:"3px 9px",borderRadius:12,fontStyle:"italic",border:`1.5px solid ${hexToRgba(a.colore||"#4f86c6",0.7)}`,fontWeight:600,background:hexToRgba(a.colore||"#4f86c6",0.22),color:"#333"}}>📋 {a.nome}</span>)}
      </div>
      <div style={{padding:"5px 20px",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <span style={{fontSize:11,fontWeight:700,color:"#888",minWidth:120,flexShrink:0}}>Tutoraggio</span><span style={{color:"#ddd",flexShrink:0}}>│</span>
        {avNamesInMonth.size===0?<span style={{fontSize:11,color:"#ccc",fontStyle:"italic"}}>Nessuno</span>:[...avNamesInMonth].map(nm=><span key={nm} style={{fontSize:11,padding:"3px 9px",borderRadius:12,fontWeight:600,color:"#444",background:"#f0f4f8",border:"1px solid #dde"}}>{nm.substring(0,28)}</span>)}
      </div>
    </div>)}
    {view==="avviso"&&(<div style={{background:"#fff",borderBottom:"1px solid #dde",flexShrink:0}}>
      <div style={{padding:"5px 20px",borderBottom:"1px solid #f0f0f0",display:"flex",alignItems:"center",gap:8}}><span style={{fontWeight:700,color:"#1a3a5c",fontSize:13}}>🕐 {totAvOre%1===0?totAvOre:totAvOre.toFixed(1)}h avvisi</span></div>
      <div style={{padding:"5px 20px",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <span style={{fontSize:11,fontWeight:700,color:"#888",minWidth:120,flexShrink:0}}>Avvisi/Progetti</span><span style={{color:"#ddd",flexShrink:0}}>│</span>
        {avThisMonth.length===0?<span style={{fontSize:11,color:"#ccc",fontStyle:"italic"}}>Nessuno</span>:avThisMonth.map(a=>{const active=activeAvvisi.has(a.id);return<button key={a.id} onClick={()=>toggleAv(a.id)} style={{fontSize:11,padding:"3px 9px",borderRadius:12,cursor:"pointer",border:`1.5px solid ${hexToRgba(a.colore||"#4f86c6",0.8)}`,fontWeight:600,fontStyle:"italic",background:active?hexToRgba(a.colore||"#4f86c6",0.25):"transparent",color:active?"#333":"#aaa"}}>📋 {a.nome}</button>;})}
      </div>
    </div>)}

    {calView==="month"
      ?<MonthView month={month} tutByDay={view==="tutoraggio"?buildMTByDay():null} avByDay={view==="tutoraggio"?(showOvr?buildOvByDay():null):null} onDayClick={canEdit?d=>setModal({type:"add",mode:view,prefill:{day:d,start:9,end:10}}):null}/>
      :<CalendarGrid days={vdays} monthData={month} tutByDay={view==="tutoraggio"?buildTByDay():null} avOverlayByDay={view==="tutoraggio"?buildOvByDay():null} avByDay={view==="avviso"?buildAvByDay():null} footerByDay={view==="tutoraggio"?Object.fromEntries(Object.entries(dayTOre).map(([d,o])=>[d,`${o%1===0?o:o.toFixed(1)}h`])):{}} overlayActive={showOvr} slotH={slotH} colW={colW} onGridClick={canEdit?handleGridClick:null} onTutDragEnd={canEdit?handleTutDragEnd:null} onAvDragEnd={canEdit?handleAvDragEnd:null}/>}

    <ZoomBar calView={calView} zoomIdx={zoomIdx} onZoomChange={setZoomIdx} onCalViewChange={v=>setCalView(v)} onWeekNav={navWeek}/>
    {showTutPanel&&<TutorPanel tutors={tutors} onSave={handleSaveTutors} onClose={()=>setShowTutPanel(false)}/>}
    {showAnagraficaAv&&<AnagraficaAvPanel anagraficaAv={anagraficaAv} onSave={handleSaveAna} onClose={()=>setShowAnagraficaAv(false)}/>}
    {showTutPanel2&&<TutoraggiPanel tutors={tutors} tutEvents={tutEvents} anagraficaAv={anagraficaAv} onClose={()=>setShowTutPanel2(false)}/>}
    {showRiepilogoAv&&<RiepilogoAvPanel avvisi={avvisi} anagraficaAv={anagraficaAv} onClose={()=>setShowRiepilogoAv(false)}/>}
    {showUsers&&<UsersPanel isSuperAdmin={isSuperAdmin} onClose={()=>setShowUsers(false)}/>}
    {showRiep&&<RiepilogoPanel avvisi={avvisi} anagraficaAv={anagraficaAv} tutors={tutors} tutEvents={tutEvents} currentMonthKey={month.key} onClose={()=>setShowRiep(false)}/>}
    {showSettings&&<SettingsPanel settings={settings} onSave={handleSaveSettings} onClose={()=>setShowSettings(false)} isSuperAdmin={isSuperAdmin} onLoadDemo={handleLoadDemo} onClearDb={handleClearDb}/>}
    {showAi&&<AiPanel tutors={tutors} anagraficaAv={anagraficaAv} settings={settings} user={user} isSuperAdmin={isSuperAdmin} onAddTut={addTutoraggio} onAddAv={addAvviso} onOpenTutorPanel={()=>setShowTutPanel(true)} onOpenAvPanel={()=>setShowAnagraficaAv(true)} onClose={()=>setShowAi(false)}/>}
    {showLog&&<LogPanel onClose={()=>setShowLog(false)}/>}
    {showBackup&&<BackupPanel avvisi={avvisi} tutors={tutors} tutEvents={tutEvents} anagraficaAv={anagraficaAv} onClose={()=>setShowBackup(false)}/>}
    {showVerifica&&<VerificaModal errors={verificaErr} onClose={()=>setShowVerifica(false)} onNavigate={onVerificaNav}/>}
    {modal&&canEdit&&<AddModal mode={modal.mode||view} prefill={modal.prefill} currentMonthIdx={monthIdx} avvisi={avvisi} anagraficaAv={anagraficaAv} tutors={tutors} editTarget={modal.type==="edit-tut"?{type:"tutoraggio",ev:modal.ev}:modal.type==="edit-av"?{type:"avviso",avviso:modal.avviso,ev:modal.ev}:null} onAddTut={addTutoraggio} onEditTut={editTutoraggio} onDeleteTut={deleteTutoraggio} onAddAv={addAvviso} onEditAv={editAvviso} onDeleteAv={deleteAvviso} onClose={()=>setModal(null)} onOpenTutorPanel={()=>setShowTutPanel(true)} onOpenAvPanel={()=>setShowAnagraficaAv(true)}/>}
  </React.Fragment>);
}
window.__mountApp=(user)=>{const root=ReactDOM.createRoot(document.getElementById("root"));root.render(<App user={user}/>);};
</script>
</body>
</html>
