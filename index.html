    *{box-sizing:border-box;margin:0;padding:0;}

    #root{height:100vh;display:flex;flex-direction:column;}

    .divider span{color:rgba(255,255,255,0.4);font-size:12px;}
    #login-google-btn{width:100%;padding:10px;border:1px solid rgba(255,255,255,0.3);border-radius:8px;background:#fff;color:#1a3a5c;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;}
    #login-google-btn img{width:20px;height:20px;}
    #login-error{color:#ff8a80;margin-top:14px;font-size:13px;text-align:center;max-width:340px;}
    #saving-indicator{position:fixed;bottom:60px;right:16px;background:#1a3a5c;color:#fff;padding:8px 16px;border-radius:20px;font-size:12px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:9999;}

    .zoom-bar{position:fixed;bottom:16px;right:16px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:20px;padding:6px 14px;box-shadow:0 2px 12px rgba(0,0,0,0.15);z-index:100;}

<body>
<div id="login-screen">
  <h1>📅 Calendario Tutoraggi</h1>
  <div id="login-box">
    <div id="login-tabs">
      <button class="login-tab active" onclick="showLoginTab('login')">Accedi</button>

      <input id="reg-password" type="password" placeholder="Password (min. 6 caratteri)"/>

<script>
  const firebaseConfig={apiKey:"AIzaSyBYFTqjac0-qoCsXtVe3REgu5Tox74tyms",authDomain:"tutoraggi-6e06b.firebaseapp.com",projectId:"tutoraggi-6e06b",storageBucket:"tutoraggi-6e06b.firebasestorage.app",messagingSenderId:"682477734775",appId:"1:682477734775:web:63b092a7cc04f505646f72"};
  firebase.initializeApp(firebaseConfig);
  const auth=firebase.auth(),db=firebase.firestore();
  function showLoginTab(t){document.getElementById("tab-login").style.display=t==="login"?"block":"none";document.getElementById("tab-register").style.display=t==="register"?"block":"none";document.querySelectorAll(".login-tab").forEach((b,i)=>b.classList.toggle("active",(t==="login"&&i===0)||(t==="register"&&i===1)));document.getElementById("login-error").textContent="";}
  function showErr(m){document.getElementById("login-error").textContent=m;}
  document.getElementById("login-google-btn").onclick=()=>{showErr("");auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>showErr(e.message));};
  document.getElementById("login-email-btn").onclick=async()=>{showErr("");const email=document.getElementById("login-email").value.trim(),pass=document.getElementById("login-password").value;if(!email||!pass){showErr("Inserisci email e password.");return;}try{await auth.signInWithEmailAndPassword(email,pass);}catch(e){showErr(e.code==="auth/user-not-found"?"Account non trovato.":e.code==="auth/wrong-password"?"Password errata.":e.message);}};
  document.getElementById("register-btn").onclick=async()=>{showErr("");const email=document.getElementById("reg-email").value.trim().toLowerCase(),pass=document.getElementById("reg-password").value,pass2=document.getElementById("reg-password2").value;if(!email||!pass){showErr("Compila tutti i campi.");return;}if(pass.length<6){showErr("Password min. 6 caratteri.");return;}if(pass!==pass2){showErr("Le password non coincidono.");return;}try{const snap=await db.collection("authorizedEmails").doc(email).get();if(!snap.exists){showErr("Email non autorizzata.");return;}await auth.createUserWithEmailAndPassword(email,pass);}catch(e){showErr(e.code==="auth/email-already-in-use"?"Account già esistente.":e.message);}};
  function showSaving(){const el=document.getElementById("saving-indicator");el.classList.add("show");clearTimeout(window._st);window._st=setTimeout(()=>el.classList.remove("show"),1500);}
  auth.onAuthStateChanged(user=>{if(user){document.getElementById("login-screen").style.display="none";document.getElementById("root").style.display="flex";if(window.__mountApp)window.__mountApp(user);}else{document.getElementById("login-screen").style.display="flex";document.getElementById("root").style.display="none";}});
</script>

<script type="text/babel">
const {useState,useEffect,useRef}=React;
const BASE_SLOT_H=48;
const DAY_NAMES=["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
const DAY_NAMES_SHORT=["L","M","M","G","V","S","D"];
const MONTHS=[{key:"gen-26",label:"Gennaio 2026",year:2026,month:0,days:31},{key:"feb-26",label:"Febbraio 2026",year:2026,month:1,days:28},{key:"mar-26",label:"Marzo 2026",year:2026,month:2,days:31},{key:"apr-26",label:"Aprile 2026",year:2026,month:3,days:30},{key:"mag-26",label:"Maggio 2026",year:2026,month:4,days:31},{key:"giu-26",label:"Giugno 2026",year:2026,month:5,days:30},{key:"lug-26",label:"Luglio 2026",year:2026,month:6,days:31},{key:"ago-26",label:"Agosto 2026",year:2026,month:7,days:31},{key:"set-26",label:"Settembre 2026",year:2026,month:8,days:30},{key:"ott-26",label:"Ottobre 2026",year:2026,month:9,days:31},{key:"nov-26",label:"Novembre 2026",year:2026,month:10,days:30},{key:"dic-26",label:"Dicembre 2026",year:2026,month:11,days:31}];
const PALETTE=["#e74c3c","#c0392b","#e67e22","#d35400","#f1c40f","#f39c12","#2ecc71","#27ae60","#1abc9c","#16a085","#3498db","#2980b9","#9b59b6","#8e44ad","#34495e","#2c3e50","#e91e63","#9c27b0","#673ab7","#3f51b5","#2196f3","#03a9f4","#00bcd4","#009688","#4caf50","#8bc34a","#cddc39","#ffeb3b","#ffc107","#ff9800","#ff5722","#795548","#9e9e9e","#607d8b","#f06292","#ba68c8","#4db6ac","#4fc3f7","#aed581","#fff176","#ffb74d","#ff8a65","#a1887f","#90a4ae","#80cbc4","#ce93d8","#ef9a9a","#80deea","#c5e1a5","#ffe082"];
const TUTOR_COLORS=["#3498db","#e74c3c","#2ecc71","#9b59b6","#e67e22","#1abc9c","#e91e63","#f39c12","#34495e","#16a085","#8e44ad","#c0392b"];
const ZOOM_LEVELS=[0.4,0.6,0.8,1,1.25,1.5,2];

function hexToRgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}
function fmt(h){return `${String(Math.floor(h)).padStart(2,"0")}:${String(Math.round((h%1)*60)).padStart(2,"0")}`;}
function timeStrToH(s){const[hh,mm]=s.split(":").map(Number);return hh+(mm||0)/60;}
function hToTimeStr(h){const hh=Math.floor(h),mm=Math.round((h-hh)*60);return `${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`;}
function snapH(h){return Math.round(h*4)/4;}
function layoutEvents(evs){const sorted=[...evs].sort((a,b)=>a.start-b.start);const cols=[];const result=sorted.map(ev=>{for(let c=0;c<cols.length;c++)if(cols[c].end<=ev.start){cols[c]={end:ev.end};return{ev,col:c};}cols.push({end:ev.end});return{ev,col:cols.length-1};});return result.map(({ev,col})=>({ev,col,numCols:cols.length}));}
function exportJSON(avvisi,tutors,tutEvents){const data={version:3,exportedAt:new Date().toISOString(),avvisi,tutors,tutEvents};const b64=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));const a=document.createElement("a");a.href=`data:application/json;base64,${b64}`;a.download=`calendario_${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);}

// Firestore
async function fsLoadData(){try{const[av,tu,te,set]=await Promise.all([db.collection("avvisi").get(),db.collection("tutors").get(),db.collection("tutEvents").get(),db.collection("settings").doc("app").get()]);const tutEvents={};te.docs.forEach(d=>{tutEvents[d.id]=d.data();});return{avvisi:av.docs.map(d=>d.data()),tutors:tu.docs.map(d=>d.data()),tutEvents,settings:set.exists?set.data():{}};}catch(e){console.error(e);return{avvisi:[],tutors:[],tutEvents:{},settings:{}};}}
async function fsSaveAvvisi(avvisi){showSaving();const batch=db.batch();const snap=await db.collection("avvisi").get();snap.docs.forEach(d=>batch.delete(d.ref));avvisi.forEach(av=>batch.set(db.collection("avvisi").doc(av.id),av));await batch.commit();}
async function fsSaveTutors(tutors){showSaving();const batch=db.batch();const snap=await db.collection("tutors").get();snap.docs.forEach(d=>batch.delete(d.ref));tutors.forEach(t=>batch.set(db.collection("tutors").doc(t.id),t));await batch.commit();}
async function fsSaveTutEvents(tutorId,monthKey,events){showSaving();await db.collection("tutEvents").doc(tutorId).set({[monthKey]:events},{merge:true});}
async function fsSaveSettings(settings){await db.collection("settings").doc("app").set(settings,{merge:true});}

// ── UI HELPERS ────────────────────────────────────────────────────────────────
function MiniCalendar({initialMonthIdx,selected,onSelect}){
  const[mIdx,setMIdx]=useState(initialMonthIdx);
  const md=MONTHS[mIdx];const{year,month,days}=md;
  const firstDow=new Date(year,month,1).getDay();const offset=firstDow===0?6:firstDow-1;
  const cells=[];for(let i=0;i<offset;i++)cells.push(null);for(let d=1;d<=days;d++)cells.push(d);while(cells.length%7!==0)cells.push(null);
  return(<div style={{background:"#fff",border:"1px solid #dde",borderRadius:10,padding:10,boxShadow:"0 4px 16px rgba(0,0,0,0.13)",position:"absolute",zIndex:400,top:"100%",left:0,marginTop:4,width:240}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
      <button onClick={()=>setMIdx(i=>Math.max(0,i-1))} disabled={mIdx===0} style={{background:"none",border:"none",cursor:"pointer",fontSize:16,color:mIdx===0?"#ccc":"#555",padding:"0 4px"}}>‹</button>
      <span style={{fontSize:12,fontWeight:700,color:"#1a3a5c"}}>{md.label}</span>
      <button onClick={()=>setMIdx(i=>Math.min(MONTHS.length-1,i+1))} disabled={mIdx===MONTHS.length-1} style={{background:"none",border:"none",cursor:"pointer",fontSize:16,color:mIdx===MONTHS.length-1?"#ccc":"#555",padding:"0 4px"}}>›</button>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
      {DAY_NAMES_SHORT.map((d,i)=><div key={i} style={{textAlign:"center",fontSize:10,fontWeight:700,color:"#888",padding:"2px 0"}}>{d}</div>)}
      {cells.map((d,i)=>{const isSel=d===selected&&mIdx===initialMonthIdx,dow=i%7,isWk=dow===5||dow===6;return(<div key={i} onClick={()=>d&&onSelect(d,mIdx)} style={{textAlign:"center",fontSize:12,padding:"4px 2px",borderRadius:6,cursor:d?"pointer":"default",background:isSel?"#4f86c6":"transparent",color:isSel?"#fff":isWk?"#9b59b6":d?"#333":"transparent",fontWeight:isSel?700:400}} onMouseEnter={e=>{if(d&&!isSel)e.currentTarget.style.background="#f0f4f8";}} onMouseLeave={e=>{if(d&&!isSel)e.currentTarget.style.background="transparent";}}>{d||""}</div>);})}
    </div>
  </div>);
}
function DayPicker({initialMonthIdx,value,selectedMonthIdx,onChange}){
  const[open,setOpen]=useState(false);
  const mLabel=MONTHS[selectedMonthIdx??initialMonthIdx]?.label||"";
  return(<div style={{position:"relative",marginBottom:10}}>
    <label style={{fontSize:12,color:"#555",display:"block",marginBottom:3}}>Giorno</label>
    <button type="button" onClick={()=>setOpen(o=>!o)} style={{width:"100%",padding:"7px 10px",borderRadius:6,border:"1px solid #ccc",background:"#fff",cursor:"pointer",textAlign:"left",fontSize:13,display:"flex",justifyContent:"space-between",alignItems:"center",boxSizing:"border-box"}}>
      <span>{value?`${value} ${mLabel}`:"Seleziona giorno"}</span><span>📅</span>
    </button>
    {open&&<MiniCalendar initialMonthIdx={initialMonthIdx} selected={value} onSelect={(d,mIdx)=>{onChange(d,mIdx);setOpen(false);}}/>}
  </div>);
}
function TimePicker({label,value,onChange}){
  const[hh,mm]=value.split(":").map(Number);
  return(<div style={{flex:1}}>
    <label style={{fontSize:12,color:"#555",display:"block",marginBottom:3}}>{label}</label>
    <div style={{display:"flex",gap:4,alignItems:"center"}}>
      <select value={hh} onChange={e=>onChange(`${String(+e.target.value).padStart(2,"0")}:${String(mm).padStart(2,"0")}`)} style={{flex:1,padding:"5px 4px",borderRadius:6,border:"1px solid #ccc",fontSize:13}}>
        {Array.from({length:13},(_,i)=>i+8).map(h=><option key={h} value={h}>{String(h).padStart(2,"0")}</option>)}
      </select>
      <span style={{color:"#888",fontWeight:700}}>:</span>
      <select value={mm} onChange={e=>onChange(`${String(hh).padStart(2,"0")}:${String(+e.target.value).padStart(2,"0")}`)} style={{flex:1,padding:"5px 4px",borderRadius:6,border:"1px solid #ccc",fontSize:13}}>
        {[0,15,30,45].map(m=><option key={m} value={m}>{String(m).padStart(2,"0")}</option>)}
      </select>
    </div>
  </div>);
}
function ColorPicker({value,onChange}){
  const[open,setOpen]=useState(false);
  return(<div style={{marginBottom:10}}>
    <label style={{fontSize:12,color:"#555"}}>Colore</label>
    <div style={{display:"flex",alignItems:"center",gap:8,marginTop:3}}>
      <div style={{width:26,height:26,borderRadius:6,background:value,border:"1px solid #ccc"}}/>
      <button type="button" onClick={()=>setOpen(o=>!o)} style={{background:"none",border:"1px solid #ccc",borderRadius:6,cursor:"pointer",padding:"4px 10px",fontSize:12}}>🎨 {open?"Chiudi":"Scegli"}</button>
    </div>
    {open&&<div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:8,background:"#f8f8f8",borderRadius:8,padding:8,border:"1px solid #eee"}}>{PALETTE.map(c=><div key={c} onClick={()=>{onChange(c);setOpen(false);}} style={{width:22,height:22,borderRadius:4,background:c,cursor:"pointer",border:value===c?"3px solid #333":"2px solid transparent",boxSizing:"border-box"}}/>)}</div>}
  </div>);
}

// ── DRAGGABLE SLOTS ───────────────────────────────────────────────────────────
function DraggableSlot({ev,col,numCols,color,tutorLabel,overlayActive,slotH,onEdit,onClick,onDragEnd}){
  const top=(ev.start-8)*slotH,h=Math.max((ev.end-ev.start)*slotH,20);
  const pad=overlayActive?5:1,w=`calc(${100/numCols}% - ${pad*2+2}px)`,left=`calc(${(col/numCols)*100}% + ${pad+1}px)`;
  const dragRef=useRef(null),resizeRef=useRef(null);
  function onBodyDown(e){if(e.target===resizeRef.current)return;e.stopPropagation();const sy=e.clientY,sx=e.clientX,os=ev.start,oe=ev.end,od=ev.day;let moved=false;
    function onMove(me){moved=true;const dh=(me.clientY-sy)/slotH,dd=Math.round((me.clientX-sx)/140),ns=Math.max(8,Math.min(19.75,snapH(os+dh)));if(dragRef.current){dragRef.current.style.top=`${(ns-8)*slotH}px`;dragRef.current.style.transform=`translateX(${dd*140}px)`;}}
    function onUp(me){document.removeEventListener("mousemove",onMove);document.removeEventListener("mouseup",onUp);if(!moved)return;const dh=(me.clientY-sy)/slotH,dd=Math.round((me.clientX-sx)/140),ns=Math.max(8,Math.min(19.75,snapH(os+dh))),ne=Math.min(20,ns+(oe-os)),nd=Math.max(1,od+dd);if(dragRef.current)dragRef.current.style.transform="";if(ns!==os||ne!==oe||nd!==od)onDragEnd({...ev,start:ns,end:ne,day:nd});}
    document.addEventListener("mousemove",onMove);document.addEventListener("mouseup",onUp);}
  function onResizeDown(e){e.stopPropagation();e.preventDefault();const sy=e.clientY,oe=ev.end,os=ev.start;
    function onMove(me){const ne=Math.max(os+0.25,Math.min(20,snapH(oe+(me.clientY-sy)/slotH)));if(dragRef.current)dragRef.current.style.height=`${Math.max((ne-os)*slotH,20)}px`;}
    function onUp(me){document.removeEventListener("mousemove",onMove);document.removeEventListener("mouseup",onUp);const ne=Math.max(os+0.25,Math.min(20,snapH(oe+(me.clientY-sy)/slotH)));if(ne!==oe)onDragEnd({...ev,end:ne,ore:ne-os});}
    document.addEventListener("mousemove",onMove);document.addEventListener("mouseup",onUp);}
  return(<div ref={dragRef} style={{position:"absolute",top,left,width:w,height:h,borderRadius:5,overflow:"visible",boxSizing:"border-box",zIndex:3,background:color||"#4f86c6",userSelect:"none"}} title={`${ev.name}\n${fmt(ev.start)}–${fmt(ev.end)}${tutorLabel?"\n"+tutorLabel:""}`}>
    <div onClick={e=>{e.stopPropagation();onEdit&&onEdit();}} style={{padding:"2px 5px",cursor:"pointer",fontSize:10,fontWeight:700,color:"#fff",background:"rgba(0,0,0,0.08)",borderBottom:"1px solid rgba(255,255,255,0.2)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",borderRadius:"5px 5px 0 0"}}>✏️ {ev.name}</div>
    <div onMouseDown={onBodyDown} onClick={e=>{e.stopPropagation();onClick&&onClick();}} style={{padding:"1px 5px",fontSize:10,color:"rgba(255,255,255,0.9)",cursor:"grab",height:"calc(100% - 22px - 8px)"}}>{fmt(ev.start)}–{fmt(ev.end)}{tutorLabel?` · ${tutorLabel}`:""}</div>
    <div ref={resizeRef} onMouseDown={onResizeDown} style={{position:"absolute",bottom:0,left:0,right:0,height:8,cursor:"ns-resize",background:"rgba(0,0,0,0.15)",borderRadius:"0 0 5px 5px",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:20,height:2,background:"rgba(255,255,255,0.6)",borderRadius:1}}/></div>
  </div>);
}
function AvOverlaySlot({ev,col,numCols,color,slotH}){
  const top=(ev.start-8)*slotH,h=Math.max((ev.end-ev.start)*slotH,20);
  const w=`calc(${100/numCols}% - 3px)`,left=`calc(${(col/numCols)*100}% + 1px)`;
  return(<div style={{position:"absolute",top,left,width:w,height:h,borderRadius:5,boxSizing:"border-box",zIndex:10,background:"transparent",border:`2.5px solid ${color}`,pointerEvents:"none"}}>
    <div style={{position:"absolute",top:-10,left:4,fontSize:9,fontWeight:700,color:color,background:"#fff",padding:"1px 4px",borderRadius:3,border:`1px solid ${color}`,whiteSpace:"nowrap",overflow:"hidden",maxWidth:"90%",textOverflow:"ellipsis",lineHeight:1.4}}>{(ev.avvisoName||ev.name||"").substring(0,20)}</div>
  </div>);
}
function AvDraggableSlot({ev,col,numCols,color,slotH,onEdit,onClick,onDragEnd}){
  const top=(ev.start-8)*slotH,h=Math.max((ev.end-ev.start)*slotH,20);
  const w=`calc(${100/numCols}% - 3px)`,left=`calc(${(col/numCols)*100}% + 1px)`;
  const dragRef=useRef(null),resizeRef=useRef(null);
  function onBodyDown(e){if(e.target===resizeRef.current)return;e.stopPropagation();const sy=e.clientY,sx=e.clientX,os=ev.start,oe=ev.end,od=ev.day;let moved=false;
    function onMove(me){moved=true;const ns=Math.max(8,Math.min(19.75,snapH(os+(me.clientY-sy)/slotH))),dd=Math.round((me.clientX-sx)/140);if(dragRef.current){dragRef.current.style.top=`${(ns-8)*slotH}px`;dragRef.current.style.transform=`translateX(${dd*140}px)`;}}
    function onUp(me){document.removeEventListener("mousemove",onMove);document.removeEventListener("mouseup",onUp);if(!moved)return;const ns=Math.max(8,Math.min(19.75,snapH(os+(me.clientY-sy)/slotH))),ne=Math.min(20,ns+(oe-os)),nd=Math.max(1,od+Math.round((me.clientX-sx)/140));if(dragRef.current)dragRef.current.style.transform="";if(ns!==os||ne!==oe||nd!==od)onDragEnd({...ev,start:ns,end:ne,day:nd});}
    document.addEventListener("mousemove",onMove);document.addEventListener("mouseup",onUp);}
  function onResizeDown(e){e.stopPropagation();e.preventDefault();const sy=e.clientY,oe=ev.end,os=ev.start;
    function onMove(me){const ne=Math.max(os+0.25,Math.min(20,snapH(oe+(me.clientY-sy)/slotH)));if(dragRef.current)dragRef.current.style.height=`${Math.max((ne-os)*slotH,20)}px`;}
    function onUp(me){document.removeEventListener("mousemove",onMove);document.removeEventListener("mouseup",onUp);const ne=Math.max(os+0.25,Math.min(20,snapH(oe+(me.clientY-sy)/slotH)));if(ne!==oe)onDragEnd({...ev,end:ne,ore:ne-os});}
    document.addEventListener("mousemove",onMove);document.addEventListener("mouseup",onUp);}
  return(<div ref={dragRef} style={{position:"absolute",top,left,width:w,height:h,borderRadius:5,overflow:"hidden",boxSizing:"border-box",zIndex:2,background:hexToRgba(color,0.4),border:`1.5px dashed ${color}`,userSelect:"none"}}>
    <div onClick={e=>{e.stopPropagation();onEdit&&onEdit();}} style={{padding:"2px 5px",cursor:"pointer",fontSize:10,fontWeight:700,color:"#444",background:"rgba(0,0,0,0.07)",borderBottom:"1px dashed rgba(0,0,0,0.15)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>✏️ {ev.avvisoName}</div>
    <div onMouseDown={onBodyDown} onClick={e=>{e.stopPropagation();onClick&&onClick();}} style={{padding:"1px 5px",fontSize:10,color:"#555",cursor:"grab",height:"calc(100% - 22px - 8px)"}}>{fmt(ev.start)}–{fmt(ev.end)}</div>
    <div ref={resizeRef} onMouseDown={onResizeDown} style={{position:"absolute",bottom:0,left:0,right:0,height:8,cursor:"ns-resize",background:"rgba(0,0,0,0.1)",borderRadius:"0 0 5px 5px",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{width:20,height:2,background:"rgba(0,0,0,0.3)",borderRadius:1}}/></div>
  </div>);
}

// ── CALENDAR GRID ─────────────────────────────────────────────────────────────
function CalendarGrid({month,tutByDay,avOverlayByDay,avByDay,footerByDay,overlayActive,slotH,onGridClick,onTutDragEnd,onAvDragEnd}){
  const HOURS=Array.from({length:13},(_,i)=>i+8);
  const TIME_W=52,DAY_W=140;
  const daysArr=Array.from({length:month.days},(_,i)=>i+1);
  const isWeekend=d=>[0,6].includes(new Date(month.year,month.month,d).getDay());
  const getDayName=d=>DAY_NAMES[new Date(month.year,month.month,d).getDay()];
  return(<div style={{flex:1,overflowX:"auto",overflowY:"auto"}}>
    <div style={{display:"flex",minWidth:TIME_W+month.days*DAY_W}}>
      <div style={{width:TIME_W,flexShrink:0,position:"sticky",left:0,zIndex:10,background:"#f0f4f8"}}>
        <div style={{height:40,borderBottom:"1px solid #ccc",borderRight:"1px solid #ccc",background:"#e8edf3"}}/>
        <div style={{position:"relative",height:12*slotH}}>
          {HOURS.map(h=><div key={h} style={{position:"absolute",top:(h-8)*slotH,width:"100%",fontSize:10,color:"#888",paddingRight:4,textAlign:"right",borderTop:"1px solid #e0e0e0",height:slotH,boxSizing:"border-box"}}>{String(h).padStart(2,"0")}:00</div>)}
        </div>
        <div style={{height:20,background:"#e8edf3",borderTop:"1px solid #dde"}}/>
      </div>
      {daysArr.map(d=>{
        const wk=isWeekend(d),footer=footerByDay?.[d];
        const tutEvs=tutByDay?.[d]||[],avOvEvs=(overlayActive&&avOverlayByDay)?avOverlayByDay[d]||[]:[];
        const avEvs=avByDay?.[d]||[];
        const lT=layoutEvents(tutEvs),lO=layoutEvents(avOvEvs),lA=layoutEvents(avEvs);
        return(<div key={d} style={{width:DAY_W,flexShrink:0,borderRight:"1px solid #dde"}}>
          <div style={{height:40,background:wk?"#e8e0f0":"#e8edf3",borderBottom:"1px solid #ccc",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",position:"sticky",top:0,zIndex:5}}>
            <span style={{fontSize:11,color:wk?"#9b59b6":"#555"}}>{getDayName(d)}</span>
            <span style={{fontWeight:700,fontSize:14,color:wk?"#9b59b6":"#1a3a5c"}}>{d}</span>
          </div>
          <div onClick={e=>onGridClick&&onGridClick(d,e)} style={{position:"relative",height:12*slotH,background:wk?"rgba(155,89,182,0.04)":"#fff",cursor:"crosshair",overflow:"visible"}}>
            {HOURS.map(h=><div key={h} style={{position:"absolute",top:(h-8)*slotH,left:0,right:0,height:slotH,borderTop:"1px solid #f0f0f0"}}/>)}
            {lT.map(({ev,col,numCols},i)=><DraggableSlot key={"t"+i} ev={ev} col={col} numCols={numCols} color={ev._color||"#4f86c6"} tutorLabel={ev._tutorLabel} overlayActive={overlayActive} slotH={slotH} onEdit={ev._onEdit} onClick={ev._onClick} onDragEnd={u=>onTutDragEnd&&onTutDragEnd(ev.id,u)}/>)}
            {lO.map(({ev,col,numCols},i)=><AvOverlaySlot key={"ov"+i} ev={ev} col={col} numCols={numCols} color={ev.avColor} slotH={slotH}/>)}
            {lA.map(({ev,col,numCols},i)=><AvDraggableSlot key={"a"+i} ev={ev} col={col} numCols={numCols} color={ev.avColor} slotH={slotH} onEdit={ev._onEdit} onClick={ev._onClick} onDragEnd={u=>onAvDragEnd&&onAvDragEnd(ev.avvisoId,ev.id,u)}/>)}
          </div>
          <div style={{height:20,background:wk?"#f0ebf8":"#f5f8fc",borderTop:"1px solid #dde",display:"flex",alignItems:"center",justifyContent:"center"}}>
            {footer?<span style={{fontSize:10,fontWeight:700,color:"#1a3a5c"}}>{footer}</span>:<span style={{fontSize:10,color:"#ccc"}}>—</span>}
          </div>
        </div>);
      })}
    </div>
  </div>);
}

// ── MONTH VIEW ────────────────────────────────────────────────────────────────
function MonthView({month,tutByDay,avByDay,overlayActive}){
  const daysArr=Array.from({length:month.days},(_,i)=>i+1);
  const isWeekend=d=>[0,6].includes(new Date(month.year,month.month,d).getDay());
  const firstDow=(new Date(month.year,month.month,1).getDay()||7)-1;
  return(<div style={{flex:1,overflowY:"auto",padding:12}}>
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
      {["Lun","Mar","Mer","Gio","Ven","Sab","Dom"].map((d,i)=><div key={i} style={{textAlign:"center",fontSize:11,fontWeight:700,color:"#888",padding:"4px 0"}}>{d}</div>)}
      {Array.from({length:firstDow},(_,i)=><div key={`e${i}`}/>)}
      {daysArr.map(d=>{
        const wk=isWeekend(d),tEvs=tutByDay?.[d]||[],aEvs=(overlayActive&&avByDay)?avByDay[d]||[]:[];
        const all=[...tEvs,...aEvs];
        return(<div key={d} style={{minHeight:80,border:`1px solid ${wk?"#e0d8f0":"#dde"}`,borderRadius:8,padding:4,background:wk?"rgba(155,89,182,0.04)":"#fff",cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.background=wk?"rgba(155,89,182,0.08)":"#f5f8fc"} onMouseLeave={e=>e.currentTarget.style.background=wk?"rgba(155,89,182,0.04)":"#fff"}>
          <div style={{fontSize:12,fontWeight:700,color:wk?"#9b59b6":"#1a3a5c",marginBottom:3}}>{d}</div>
          {all.slice(0,3).map((ev,i)=><div key={i} style={{height:6,borderRadius:3,background:ev.avColor||ev._color||"#4f86c6",opacity:0.85,marginBottom:2}}/>)}
          {all.length>3&&<div style={{fontSize:9,color:"#888"}}>+{all.length-3}</div>}
        </div>);
      })}
    </div>
  </div>);
}

// ── AI PANEL ──────────────────────────────────────────────────────────────────
function AiPanel({tutors,avvisi,settings,user,onAddTut,onAddAv,onClose}){
  const[messages,setMessages]=useState([]);const[step,setStep]=useState("welcome");const[importType,setImportType]=useState(null);const[selectedTutor,setSelectedTutor]=useState(tutors[0]?.id||"");const[avName,setAvName]=useState("");const[avColor,setAvColor]=useState(PALETTE[5]);const[pendingEvents,setPendingEvents]=useState([]);const[ambiguities,setAmbiguities]=useState([]);const[loading,setLoading]=useState(false);const[avNameInput,setAvNameInput]=useState("");
  const fileRef=useRef(),bottomRef=useRef();
  const userName=user?.email?.split("@")[0]||"utente";
  useEffect(()=>{setMessages([{role:"ai",text:`Ciao ${userName}! Cosa vuoi importare?`,buttons:[{label:"📌 Tutoraggi",value:"tutoraggio"},{label:"📋 Avviso/Progetto",value:"avviso"}]}]);},[]);
  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"});},[messages]);
  function addMsg(msg){setMessages(prev=>[...prev,msg]);}

  function handleButtonClick(value){
    addMsg({role:"user",text:value==="tutoraggio"?"📌 Tutoraggi":"📋 Avviso/Progetto"});
    setImportType(value);
    if(value==="tutoraggio"){
      if(tutors.length===0){addMsg({role:"ai",text:"Non ci sono tutor registrati. Aggiungi prima un tutor dalla sezione 👤 Tutor."});return;}
      setStep("tutor");addMsg({role:"ai",text:"A quale tutor appartengono i dati?",select:tutors.map(t=>({value:t.id,label:`${t.cognome} ${t.nome}`.trim()}))});
    } else {
      setStep("avName");addMsg({role:"ai",text:"Come si chiama questo avviso/progetto?",showInput:"avName"});
    }
  }
  function handleSelectTutor(tid){const t=tutors.find(x=>x.id===tid);setSelectedTutor(tid);addMsg({role:"user",text:`👤 ${t?.cognome} ${t?.nome}`.trim()});setStep("upload");addMsg({role:"ai",text:"Perfetto! Carica il documento (PDF, immagine, Word, CSV).",showUpload:true});}
  function handleAvNameSubmit(){if(!avNameInput.trim())return;setAvName(avNameInput);addMsg({role:"user",text:avNameInput});setStep("avColor");addMsg({role:"ai",text:"Che colore vuoi assegnare?",showColor:true});}
  function handleAvColorSubmit(color){setAvColor(color);addMsg({role:"user",text:"🎨 Colore selezionato"});setStep("upload");addMsg({role:"ai",text:"Perfetto! Carica il documento (PDF, immagine, Word, CSV).",showUpload:true});}

  async function handleFileUpload(e){
    const file=e.target.files[0];if(!file)return;e.target.value="";
    addMsg({role:"user",text:`📎 ${file.name}`});setLoading(true);
    addMsg({role:"ai",text:"Sto analizzando il documento...",isLoading:true});
    try{
      const result=await analyzeDoc(file);
      setMessages(prev=>prev.filter(m=>!m.isLoading));
      if(result.ambiguities?.length>0){setAmbiguities(result.ambiguities);setPendingEvents(result.events||[]);setStep("ambiguity");addMsg({role:"ai",text:`Ho trovato ${result.events?.length||0} appuntamenti, ma ho bisogno di chiarimenti:`,showAmbiguities:result.ambiguities,events:result.events||[]});}
      else if(result.events?.length>0){setPendingEvents(result.events);setStep("preview");addMsg({role:"ai",text:`Ho trovato ${result.events.length} appuntamenti. Confermi l'importazione?`,showPreview:result.events});}
      else{addMsg({role:"ai",text:"Non ho trovato appuntamenti. Prova con un altro file.",showUpload:true});setStep("upload");}
    }catch(err){setMessages(prev=>prev.filter(m=>!m.isLoading));addMsg({role:"ai",text:`Errore: ${err.message}`});}
    setLoading(false);
  }

  async function analyzeDoc(file){
    const provider=settings.aiProvider||"gemini";
    const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
    const mime=file.type||"application/octet-stream";
    const prompt=`Sei un assistente che estrae dati da documenti di calendari formativi. Analizza il documento e restituisci SOLO un JSON con questa struttura (nessun testo extra, nessun markdown):
{"events":[{"day":8,"month":"mag-26","start":9.5,"end":13.5,"ore":4,"name":"nome attività"}],"ambiguities":[{"field":"orario","description":"descrizione problema","eventIndex":0}]}
Regole: month in formato "mmm-yy" (mag-26,giu-26,lug-26 ecc), start/end in ore decimali (9.5=09:30), ore=durata. Se orario ambiguo inserisci in ambiguities. Restituisci SOLO il JSON.`;
    if(provider==="gemini"){
      if(!settings.geminiApiKey)throw new Error("Chiave Gemini non configurata. Vai in ⚙️ Impostazioni.");
      const isPdf=mime==="application/pdf",isImg=mime.startsWith("image/");
      const parts=isPdf||isImg?[{inline_data:{mime_type:mime,data:b64}},{text:prompt}]:[{text:`${prompt}\n\nContenuto:\n${atob(b64)}`}];
      const resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${settings.geminiApiKey}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts}]})});
      if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||"Errore Gemini");}
      const data=await resp.json();
      return parseResp(data.candidates?.[0]?.content?.parts?.[0]?.text||"{}");
    } else {
      if(!settings.openaiApiKey)throw new Error("Chiave OpenAI non configurata. Vai in ⚙️ Impostazioni.");
      const isImg=mime.startsWith("image/");
      const msgs=isImg?[{role:"user",content:[{type:"text",text:prompt},{type:"image_url",image_url:{url:`data:${mime};base64,${b64}`}}]}]:[{role:"user",content:`${prompt}\n\nContenuto:\n${mime==="application/pdf"?"[PDF]":atob(b64)}`}];
      const resp=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":`Bearer ${settings.openaiApiKey}`},body:JSON.stringify({model:"gpt-4o-mini",messages:msgs,max_tokens:2000})});
      if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||"Errore OpenAI");}
      const data=await resp.json();
      return parseResp(data.choices?.[0]?.message?.content||"{}");
    }
  }
  function parseResp(text){try{return JSON.parse(text.replace(/```json|```/g,"").trim());}catch(e){const m=text.match(/\{[\s\S]*\}/);if(m)return JSON.parse(m[0]);throw new Error("Risposta AI non valida");}}

  async function handleConfirm(){
    setLoading(true);
    try{
      if(importType==="tutoraggio"){for(const ev of pendingEvents)await onAddTut({day:ev.day,name:ev.name,start:ev.start,end:ev.end,ore:ev.ore,tutorId:selectedTutor},ev.month);}
      else{const id=`av-${Date.now()}`;const events=pendingEvents.map((ev,i)=>({id:`ave-${Date.now()}-${i}`,month:ev.month,day:ev.day,start:ev.start,end:ev.end,ore:ev.ore}));await onAddAv({name:avName,color:avColor,events,newId:id});}
      setStep("done");addMsg({role:"ai",text:`✅ Importati ${pendingEvents.length} appuntamenti con successo!`});
    }catch(err){addMsg({role:"ai",text:`Errore: ${err.message}`});}
    setLoading(false);
  }

  function renderMsg(msg,idx){
    const isAi=msg.role==="ai";
    return(<div key={idx} style={{display:"flex",flexDirection:"column",alignItems:isAi?"flex-start":"flex-end",marginBottom:12}}>
      <div style={{maxWidth:"85%",padding:"10px 14px",borderRadius:isAi?"4px 14px 14px 14px":"14px 4px 14px 14px",background:isAi?"#f0f4f8":"#4f86c6",color:isAi?"#1a3a5c":"#fff",fontSize:13,lineHeight:1.5,boxShadow:"0 1px 4px rgba(0,0,0,0.08)"}}>
        {msg.isLoading?<span style={{opacity:0.6}}>⏳ {msg.text}</span>:<span>{msg.text}</span>}
      </div>
      {msg.buttons&&<div style={{display:"flex",gap:8,marginTop:8,flexWrap:"wrap"}}>{msg.buttons.map(b=><button key={b.value} onClick={()=>handleButtonClick(b.value)} style={{padding:"8px 16px",borderRadius:20,border:"2px solid #4f86c6",background:"#fff",color:"#4f86c6",cursor:"pointer",fontWeight:700,fontSize:13}}>{b.label}</button>)}</div>}
      {msg.select&&step==="tutor"&&<div style={{marginTop:8,display:"flex",gap:8,flexWrap:"wrap"}}>{msg.select.map(o=><button key={o.value} onClick={()=>handleSelectTutor(o.value)} style={{padding:"7px 14px",borderRadius:12,border:"2px solid #4f86c6",background:"#fff",color:"#4f86c6",cursor:"pointer",fontWeight:600,fontSize:12}}>{o.label}</button>)}</div>}
      {msg.showInput==="avName"&&step==="avName"&&<div style={{marginTop:8,display:"flex",gap:8,width:"100%",maxWidth:300}}>
        <input value={avNameInput} onChange={e=>setAvNameInput(e.target.value)} placeholder="Nome avviso..." onKeyDown={e=>e.key==="Enter"&&handleAvNameSubmit()} style={{flex:1,padding:"8px 10px",borderRadius:8,border:"1px solid #ccc",fontSize:13,outline:"none"}}/>
        <button onClick={handleAvNameSubmit} style={{padding:"8px 14px",borderRadius:8,border:"none",background:"#4f86c6",color:"#fff",cursor:"pointer",fontWeight:600}}>OK</button>
      </div>}
      {msg.showColor&&step==="avColor"&&<div style={{marginTop:8,display:"flex",flexWrap:"wrap",gap:5}}>{PALETTE.slice(0,24).map(c=><div key={c} onClick={()=>handleAvColorSubmit(c)} style={{width:26,height:26,borderRadius:5,background:c,cursor:"pointer",border:"2px solid transparent",boxSizing:"border-box"}} onMouseEnter={e=>e.currentTarget.style.border="2px solid #333"} onMouseLeave={e=>e.currentTarget.style.border="2px solid transparent"}/>)}</div>}
      {msg.showUpload&&step==="upload"&&<div style={{marginTop:8}}><button onClick={()=>fileRef.current.click()} style={{padding:"9px 18px",borderRadius:10,border:"2px dashed #4f86c6",background:"#f0f6ff",color:"#4f86c6",cursor:"pointer",fontWeight:700,fontSize:13}}>📎 Carica file</button><p style={{fontSize:10,color:"#aaa",marginTop:4}}>PDF · Immagine · Word · CSV</p></div>}
      {msg.showPreview&&<div style={{marginTop:8,width:"100%",maxWidth:360}}>
        <div style={{maxHeight:200,overflowY:"auto",border:"1px solid #dde",borderRadius:8,background:"#fff",marginBottom:10}}>
          {msg.showPreview.map((ev,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",padding:"6px 10px",borderBottom:"1px solid #f0f0f0",fontSize:12}}><span style={{color:"#555"}}>{ev.day} {ev.month} — {fmt(ev.start)}–{fmt(ev.end)}</span><span style={{fontWeight:600,color:"#1a3a5c"}}>{ev.ore}h</span></div>)}
        </div>
        {step==="preview"&&<div style={{display:"flex",gap:8}}>
          <button onClick={handleConfirm} disabled={loading} style={{flex:1,padding:"9px",borderRadius:8,border:"none",background:"#2ecc71",color:"#fff",cursor:"pointer",fontWeight:700}}>{loading?"Importazione...":"✓ Conferma tutto"}</button>
          <button onClick={()=>{setStep("upload");addMsg({role:"ai",text:"Ok, puoi caricare un altro documento.",showUpload:true});}} style={{padding:"9px 14px",borderRadius:8,border:"1px solid #ccc",background:"#f5f5f5",cursor:"pointer"}}>✕</button>
        </div>}
      </div>}
      {msg.showAmbiguities&&<div style={{marginTop:8,width:"100%",maxWidth:360}}>
        {msg.showAmbiguities.map((amb,i)=><div key={i} style={{padding:"8px 10px",marginBottom:6,borderRadius:8,border:"1px solid #f0c040",background:"#fffbea",fontSize:12}}>
          <div style={{fontWeight:700,color:"#b8860b",marginBottom:4}}>⚠️ {amb.field}</div>
          <div style={{color:"#555",marginBottom:6}}>{amb.description}</div>
          <button onClick={()=>{const rem=ambiguities.filter((_,j)=>j!==i);setAmbiguities(rem);if(rem.length===0){setStep("preview");addMsg({role:"ai",text:"Grazie! Ecco il riepilogo:",showPreview:msg.events||pendingEvents});}}} style={{padding:"4px 10px",borderRadius:6,border:"none",background:"#4f86c6",color:"#fff",cursor:"pointer",fontSize:11,fontWeight:600}}>✓ Confermo</button>
        </div>)}
      </div>}
    </div>);
  }

  return(<div style={{position:"fixed",inset:0,zIndex:500,display:"flex"}}><div onClick={onClose} style={{flex:1,background:"rgba(0,0,0,0.35)"}}/>
    <div style={{width:420,background:"#fff",boxShadow:"-4px 0 24px rgba(0,0,0,0.18)",display:"flex",flexDirection:"column"}}>
      <div style={{background:"linear-gradient(135deg,#1a3a5c,#2980b9)",color:"#fff",padding:"14px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0}}>
        <div><div style={{fontWeight:700,fontSize:15}}>🤖 Assistente AI</div><div style={{fontSize:11,opacity:0.7}}>{settings.aiProvider==="gemini"?"Gemini 2.0 Flash":"GPT-4o mini"}</div></div>
        <button onClick={onClose} style={{background:"none",border:"none",color:"#fff",fontSize:20,cursor:"pointer"}}>✕</button>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"16px",display:"flex",flexDirection:"column"}}>
        {messages.map((m,i)=>renderMsg(m,i))}
        <div ref={bottomRef}/>
      </div>
      <input ref={fileRef} type="file" accept=".pdf,.jpg,.jpeg,.png,.csv,.doc,.docx,.txt" style={{display:"none"}} onChange={handleFileUpload}/>
    </div>
  </div>);
}

// ── ADD/EDIT MODAL ────────────────────────────────────────────────────────────
function AddModal({mode,prefill,currentMonthIdx,avvisi,tutors,editTarget,onAddTut,onEditTut,onDeleteTut,onAddAv,onEditAv,onDeleteAv,onClose}){
  const isEdit=!!editTarget;const[tab,setTab]=useState(mode==="avviso"?"avviso":"tutoraggio");const fAv=avvisi[0];
  const[tutName,setTutName]=useState(isEdit&&editTarget.type==="tutoraggio"?editTarget.ev.name:(fAv?.name||""));
  const[tutTutor,setTutTutor]=useState(isEdit&&editTarget.type==="tutoraggio"?(editTarget.ev.tutorId||tutors[0]?.id||""):(tutors[0]?.id||""));
  const[tutDay,setTutDay]=useState(isEdit&&editTarget.type==="tutoraggio"?editTarget.ev.day:(prefill?.day||1));
  const[tutMonthIdx,setTutMonthIdx]=useState(currentMonthIdx);
  const[tutStart,setTutStart]=useState(hToTimeStr(isEdit&&editTarget.type==="tutoraggio"?editTarget.ev.start:(prefill?.start||9)));

  const[avColor,setAvColor]=useState(isEdit&&editTarget.type==="avviso"?editTarget.avviso.color:PALETTE[5]);
  const[avDay,setAvDay]=useState(isEdit&&editTarget.type==="avviso"?editTarget.ev.day:(prefill?.day||1));
  const[avMonthIdx,setAvMonthIdx]=useState(currentMonthIdx);
  const[avStart,setAvStart]=useState(hToTimeStr(isEdit&&editTarget.type==="avviso"?editTarget.ev.start:(prefill?.start||9)));
  const[avEnd,setAvEnd]=useState(hToTimeStr(isEdit&&editTarget.type==="avviso"?editTarget.ev.end:(prefill?.end||13)));
  const[newAvName,setNewAvName]=useState("");
  const inp={display:"block",width:"100%",marginBottom:10,padding:"6px 8px",borderRadius:6,border:"1px solid #ccc",boxSizing:"border-box",fontSize:13};
  const tabBtn=(t,lbl)=><button onClick={()=>setTab(t)} style={{flex:1,padding:"8px 0",border:"none",cursor:"pointer",fontWeight:600,fontSize:13,borderRadius:6,background:tab===t?"#4f86c6":"#f0f4f8",color:tab===t?"#fff":"#555"}}>{lbl}</button>;
  const selT=tutors.find(t=>t.id===tutTutor);
  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div style={{background:"#fff",borderRadius:14,padding:24,width:370,boxShadow:"0 8px 32px rgba(0,0,0,0.22)",maxHeight:"90vh",overflowY:"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><span style={{fontWeight:700,fontSize:15}}>{isEdit?"✏️ Modifica":"➕ Aggiungi"}</span><button onClick={onClose} style={{background:"none",border:"none",fontSize:18,cursor:"pointer",color:"#888"}}>✕</button></div>
      {!isEdit&&<div style={{display:"flex",gap:6,marginBottom:16}}>{tabBtn("tutoraggio","📌 Tutoraggio")}{tabBtn("avviso","📋 Avviso/Progetto")}</div>}
      {tab==="tutoraggio"&&(<>
        <label style={{fontSize:12,color:"#555",display:"block",marginBottom:3}}>Avviso/Progetto</label>
        <select value={tutName} onChange={e=>setTutName(e.target.value)} style={inp}>{avvisi.length===0?<option value="">-- prima inserire un avviso --</option>:avvisi.map(a=><option key={a.id} value={a.name}>{a.name}</option>)}</select>
        <label style={{fontSize:12,color:"#555",display:"block",marginBottom:3}}>Tutor</label>
        <select value={tutTutor} onChange={e=>setTutTutor(e.target.value)} style={inp}>{tutors.length===0?<option value="">-- prima inserire un tutor --</option>:tutors.map(t=><option key={t.id} value={t.id}>{t.cognome} {t.nome}</option>)}</select>
        {selT&&<div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,padding:"6px 10px",borderRadius:8,background:hexToRgba(selT.color||"#4f86c6",0.12)}}><div style={{width:14,height:14,borderRadius:3,background:selT.color||"#4f86c6"}}/><span style={{fontSize:12,color:"#555"}}>Colore tutor</span></div>}
        <DayPicker initialMonthIdx={tutMonthIdx} value={tutDay} selectedMonthIdx={tutMonthIdx} onChange={(d,mIdx)=>{setTutDay(d);setTutMonthIdx(mIdx);}}/>
        <div style={{display:"flex",gap:10,marginBottom:14}}><TimePicker label="Inizio" value={tutStart} onChange={setTutStart}/><TimePicker label="Fine" value={tutEnd} onChange={setTutEnd}/></div>
        <div style={{display:"flex",gap:8,justifyContent:"space-between",alignItems:"center"}}>
          {isEdit&&<button onClick={()=>{if(confirm("Eliminare?"))onDeleteTut(editTarget.ev.id);onClose();}} style={{padding:"7px 14px",borderRadius:6,border:"none",background:"#ffeaea",color:"#c0392b",cursor:"pointer",fontWeight:600,fontSize:12}}>🗑️ Elimina</button>}
          <div style={{display:"flex",gap:8,marginLeft:"auto"}}>
            <button onClick={onClose} style={{padding:"7px 16px",borderRadius:6,border:"1px solid #ccc",background:"#f5f5f5",cursor:"pointer"}}>Annulla</button>
            <button onClick={()=>{const s=timeStrToH(tutStart),e=timeStrToH(tutEnd);if(tutName&&e>s&&tutTutor){const mk=MONTHS[tutMonthIdx].key;isEdit?onEditTut(editTarget.ev.id,{day:tutDay,name:tutName,start:s,end:e,ore:e-s,tutorId:tutTutor},mk):onAddTut({day:tutDay,name:tutName,start:s,end:e,ore:e-s,tutorId:tutTutor},mk);onClose();}}} style={{padding:"7px 16px",borderRadius:6,border:"none",background:"#4f86c6",color:"#fff",cursor:"pointer",fontWeight:600}}>{isEdit?"Salva":"Aggiungi"}</button>
          </div>
        </div>
      </>)}
      {tab==="avviso"&&(<>
        <label style={{fontSize:12,color:"#555",display:"block",marginBottom:3}}>Avviso/Progetto</label>
        <select value={avId} onChange={e=>{setAvId(e.target.value);if(e.target.value!=="__new__"){const f=avvisi.find(a=>a.id===e.target.value);if(f)setAvColor(f.color);}}} style={inp}><option value="__new__">+ Nuovo avviso...</option>{avvisi.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}</select>
        {avId==="__new__"&&<input value={newAvName} onChange={e=>setNewAvName(e.target.value)} placeholder="Nome nuovo avviso..." style={inp}/>}
        <ColorPicker value={avColor} onChange={setAvColor}/>
        <DayPicker initialMonthIdx={avMonthIdx} value={avDay} selectedMonthIdx={avMonthIdx} onChange={(d,mIdx)=>{setAvDay(d);setAvMonthIdx(mIdx);}}/>
        <div style={{display:"flex",gap:10,marginBottom:10}}><TimePicker label="Inizio" value={avStart} onChange={setAvStart}/><TimePicker label="Fine" value={avEnd} onChange={setAvEnd}/></div>
        {!isEdit&&<p style={{fontSize:11,color:"#888",margin:"0 0 12px"}}>Altri appuntamenti si aggiungono in seguito.</p>}
        <div style={{display:"flex",gap:8,justifyContent:"space-between",alignItems:"center"}}>
          {isEdit&&<button onClick={()=>{if(confirm("Eliminare?"))onDeleteAv(editTarget.avviso.id,editTarget.ev.id);onClose();}} style={{padding:"7px 14px",borderRadius:6,border:"none",background:"#ffeaea",color:"#c0392b",cursor:"pointer",fontWeight:600,fontSize:12}}>🗑️ Elimina</button>}
          <div style={{display:"flex",gap:8,marginLeft:"auto"}}>
            <button onClick={onClose} style={{padding:"7px 16px",borderRadius:6,border:"1px solid #ccc",background:"#f5f5f5",cursor:"pointer"}}>Annulla</button>
            <button onClick={()=>{const s=timeStrToH(avStart),e=timeStrToH(avEnd);if(e<=s)return;const mk=MONTHS[avMonthIdx].key;const evData={month:mk,day:avDay,start:s,end:e,ore:e-s};if(isEdit){onEditAv(editTarget.avviso.id,editTarget.ev.id,evData,avColor);}else if(avId==="__new__"&&newAvName){onAddAv({name:newAvName,color:avColor,...evData});}else if(avId!=="__new__"){onAddAv({existingId:avId,...evData});}onClose();}} style={{padding:"7px 16px",borderRadius:6,border:"none",background:"#4f86c6",color:"#fff",cursor:"pointer",fontWeight:600}}>{isEdit?"Salva":"Aggiungi"}</button>
          </div>
        </div>
      </>)}
    </div>
  </div>);
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App({user}){
  // — state —
  const[view,setView]=useState("tutoraggio");
  const[tutors,setTutors]=useState([]);
  const[activeTutorIds,setActiveTutorIds]=useState(null);
  const[monthIdx,setMonthIdx]=useState(2);
  const[avvisi,setAvvisi]=useState([]);
  const[activeAvvisi,setActiveAvvisi]=useState(new Set());
  const[tutEvents,setTutEvents]=useState({});
  const[settings,setSettings]=useState({});
  const[showAvvisiOverlay,setShowAvvisiOverlay]=useState(false);
  const[zoomIdx,setZoomIdx]=useState(3);
  const[monthView,setMonthView]=useState(false);
  const[modal,setModal]=useState(null);
  const[showAnagrafica,setShowAnagrafica]=useState(false);
  const[showTutorPanel,setShowTutorPanel]=useState(false);
  const[showUsersPanel,setShowUsersPanel]=useState(false);
  const[showRiepilogo,setShowRiepilogo]=useState(false);
  const[showSettings,setShowSettings]=useState(false);
  const[showAiPanel,setShowAiPanel]=useState(false);
  const[isAdminUser,setIsAdminUser]=useState(false);
  const[loading,setLoading]=useState(true);
  const[importError,setImportError]=useState("");
  const importRef=useRef();
  const slotH=BASE_SLOT_H*ZOOM_LEVELS[zoomIdx];

  useEffect(()=>{
    fsLoadData().then(({avvisi:a,tutors:t,tutEvents:te,settings:s})=>{setAvvisi(a);setTutors(t);setTutEvents(te);setSettings(s);setActiveAvvisi(new Set(a.map(x=>x.id)));setLoading(false);});
    db.collection("authorizedEmails").doc(user.email.toLowerCase()).get().then(snap=>{if(snap.exists&&snap.data().role==="admin")setIsAdminUser(true);}).catch(()=>{});
  },[]);

  const month=MONTHS[monthIdx];
  const allTutEvs=tutors.flatMap(t=>(tutEvents[t.id]?.[month.key])||[]);
  const visibleTutEvs=activeTutorIds===null?allTutEvs:allTutEvs.filter(e=>activeTutorIds.has(e.tutorId));
  const avvisiNamesInMonth=new Set(allTutEvs.map(e=>e.name));
  const avvisiForTutBar=avvisi.filter(av=>avvisiNamesInMonth.has(av.name));
  const dayTutOre={};for(const ev of allTutEvs)dayTutOre[ev.day]=(dayTutOre[ev.day]||0)+ev.ore;
  const totalTutOre=visibleTutEvs.reduce((a,e)=>a+e.ore,0);
  const avEvs=avvisi.flatMap(av=>av.events.filter(e=>e.month===month.key).map(e=>({...e,avvisoId:av.id,avvisoName:av.name,avColor:av.color})));
  const avvisiThisMonth=avvisi.filter(av=>av.events.some(e=>e.month===month.key));
  const visibleAvEvs=avEvs.filter(e=>activeAvvisi.has(e.avvisoId));
  const totalAvOre=avEvs.reduce((a,e)=>a+e.ore,0);

  function getTutorColor(id){const t=tutors.find(x=>x.id===id);return t?.color||"#4f86c6";}
  function getTutorLabel(id){const t=tutors.find(x=>x.id===id);return t?`${t.cognome} ${t.nome}`.trim():"";}

  function buildTutByDay(){const byDay={};for(const ev of visibleTutEvs){if(!byDay[ev.day])byDay[ev.day]=[];const color=getTutorColor(ev.tutorId),tLabel=getTutorLabel(ev.tutorId);byDay[ev.day].push({...ev,_color:color,_tutorLabel:tLabel,_onEdit:()=>setModal({type:"edit-tut",ev,monthKey:month.key}),_onClick:()=>setModal({type:"add",mode:"tutoraggio",prefill:{day:ev.day,start:ev.start,end:ev.end}})});}return byDay;}
  function buildAvOverlayByDay(){const byDay={};for(const ev of avEvs){if(!byDay[ev.day])byDay[ev.day]=[];byDay[ev.day].push(ev);}return byDay;}
  function buildAvByDay(){const byDay={};for(const ev of visibleAvEvs){if(!byDay[ev.day])byDay[ev.day]=[];byDay[ev.day].push({...ev,_onEdit:()=>{const av=avvisi.find(a=>a.id===ev.avvisoId);setModal({type:"edit-av",avviso:av,ev,monthKey:month.key});},_onClick:()=>setModal({type:"add",mode:"avviso",prefill:{day:ev.day,start:ev.start,end:ev.end}})});}return byDay;}
  function buildMonthTutByDay(){const byDay={};for(const ev of visibleTutEvs){if(!byDay[ev.day])byDay[ev.day]=[];byDay[ev.day].push({...ev,_color:getTutorColor(ev.tutorId)});}return byDay;}
  function buildMonthAvByDay(){const byDay={};for(const ev of avEvs){if(!byDay[ev.day])byDay[ev.day]=[];byDay[ev.day].push(ev);}return byDay;}

  function handleGridClick(d,e){if(monthView){setMonthView(false);return;}const rect=e.currentTarget.getBoundingClientRect();const snap=Math.round((8+(e.clientY-rect.top)/slotH)*4)/4;const start=Math.min(Math.max(snap,8),19.75);setModal({type:"add",mode:view,prefill:{day:d,start,end:Math.min(start+1,20)}});}
  function toggleAvviso(id){setActiveAvvisi(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});}
  function toggleTutorFilter(id){setActiveTutorIds(prev=>{const all=new Set(tutors.map(t=>t.id));const base=prev===null?new Set(all):new Set(prev);base.has(id)?base.delete(id):base.add(id);return base.size===all.size?null:base;});}

  async function addTutoraggio(ev,monthKey){const mk=monthKey||month.key,id=`tut-${Date.now()}`,tId=ev.tutorId;const updated={...tutEvents,[tId]:{...(tutEvents[tId]||{}),[mk]:[...((tutEvents[tId]||{})[mk]||[]),{...ev,id}]}};setTutEvents(updated);await fsSaveTutEvents(tId,mk,updated[tId][mk]);}
  async function editTutoraggio(evId,updated){const newState={...tutEvents};for(const[tid,months]of Object.entries(newState)){for(const[mk,evs]of Object.entries(months)){if(evs.find(e=>e.id===evId)){newState[tid]={...months,[mk]:evs.map(e=>e.id===evId?{...e,...updated}:e)};setTutEvents(newState);await fsSaveTutEvents(tid,mk,newState[tid][mk]);return;}}};}
  async function deleteTutoraggio(evId){const newState={...tutEvents};for(const[tid,months]of Object.entries(newState)){for(const[mk,evs]of Object.entries(months)){if(evs.find(e=>e.id===evId)){newState[tid]={...months,[mk]:evs.filter(e=>e.id!==evId)};setTutEvents(newState);await fsSaveTutEvents(tid,mk,newState[tid][mk]);return;}}};}
  async function addAvviso({existingId,name,color,month:mk,day,start,end,ore,events,newId}){
    if(events&&events.length>0){const id=newId||`av-${Date.now()}`;const updated=[...avvisi,{id,name,color,events}];setAvvisi(updated);setActiveAvvisi(prev=>new Set([...prev,id]));await fsSaveAvvisi(updated);return;}
    const evData={id:`ave-${Date.now()}`,month:mk,day,start,end,ore};let updated;
    if(existingId){updated=avvisi.map(av=>av.id===existingId?{...av,events:[...av.events,evData]}:av);}
    else{const id=`av-${Date.now()}`;updated=[...avvisi,{id,name,color,events:[evData]}];setActiveAvvisi(prev=>new Set([...prev,id]));}
    setAvvisi(updated);await fsSaveAvvisi(updated);
  }
  async function editAvviso(avId,evId,evData,color){const updated=avvisi.map(av=>av.id!==avId?av:{...av,color,events:av.events.map(e=>e.id===evId?{...e,...evData}:e)});setAvvisi(updated);await fsSaveAvvisi(updated);}
  async function deleteAvviso(avId,evId){const updated=avvisi.map(av=>av.id!==avId?av:{...av,events:av.events.filter(e=>e.id!==evId)});setAvvisi(updated);await fsSaveAvvisi(updated);}
  async function handleSaveTutors(list){setTutors(list);setActiveTutorIds(null);setShowTutorPanel(false);await fsSaveTutors(list);}
  async function handleSaveSettings(s){const merged={...settings,...s};setSettings(merged);await fsSaveSettings(merged);}
  async function handleTutDragEnd(evId,updated){await editTutoraggio(evId,updated);}
  async function handleAvDragEnd(avId,evId,updated){await editAvviso(avId,evId,{month:updated.month||month.key,day:updated.day,start:updated.start,end:updated.end,ore:updated.ore||updated.end-updated.start},avvisi.find(a=>a.id===avId)?.color);}
  async function handleImport(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=async ev=>{try{const raw=JSON.parse(ev.target.result);const a=raw.avvisi||[],t=raw.tutors||[],te=raw.tutEvents||{};setAvvisi(a);setTutors(t);setTutEvents(te);setActiveAvvisi(new Set(a.map(x=>x.id)));setActiveTutorIds(null);setImportError("");await fsSaveAvvisi(a);await fsSaveTutors(t);for(const[tId,months]of Object.entries(te))for(const[mk,evs]of Object.entries(months))await fsSaveTutEvents(tId,mk,evs);}catch(err){setImportError("File non valido: "+err.message);}};reader.readAsText(file);e.target.value="";}

  const vBtn=(v,lbl)=>({padding:"7px 16px",borderRadius:8,border:"none",cursor:"pointer",fontWeight:700,fontSize:13,background:view===v?"#fff":"rgba(255,255,255,0.15)",color:view===v?"#1a3a5c":"#fff",boxShadow:view===v?"0 2px 8px rgba(0,0,0,0.15)":"none",transition:"all .15s"});
  const hBtn=(extra={})=>({background:"rgba(255,255,255,0.12)",border:"1.5px solid rgba(255,255,255,0.3)",color:"#fff",borderRadius:8,padding:"5px 13px",cursor:"pointer",fontSize:12,fontWeight:600,...extra});

  if(loading)return<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:"#888"}}>⏳ Caricamento...</div>;

  return(<React.Fragment>
    {/* HEADER */}
    <div style={{background:"#1a3a5c",color:"#fff",padding:"10px 20px",display:"flex",alignItems:"center",gap:10,flexShrink:0,flexWrap:"wrap"}}>
      <span style={{fontWeight:700,fontSize:16}}>📅</span>
      <div style={{display:"flex",gap:4,background:"rgba(255,255,255,0.1)",borderRadius:10,padding:"3px"}}>
        <button style={vBtn("tutoraggio")} onClick={()=>setView("tutoraggio")}>Calendario Tutoraggi</button>
        <button style={vBtn("avviso")} onClick={()=>setView("avviso")}>Calendario Avvisi/Progetti</button>
      </div>
      <button onClick={()=>setShowTutorPanel(true)} style={hBtn()}>👤 Tutor</button>
      <button onClick={()=>setShowAnagrafica(true)} style={hBtn()}>📋 Avvisi/Progetti</button>
      <button onClick={()=>setShowRiepilogo(true)} style={hBtn()}>📊 Riepilogo</button>
      <button onClick={()=>setShowAiPanel(true)} style={hBtn({background:"rgba(41,128,185,0.3)",border:"1.5px solid rgba(41,128,185,0.7)"})}>🤖 AI</button>
      {isAdminUser&&<><button onClick={()=>setShowUsersPanel(true)} style={hBtn({background:"rgba(231,76,60,0.3)",border:"1.5px solid rgba(231,76,60,0.6)"})}>🔐 Utenti</button><button onClick={()=>setShowSettings(true)} style={hBtn()}>⚙️ Impostazioni</button></>}
      <div style={{display:"flex",gap:6}}>
        <button onClick={()=>exportJSON(avvisi,tutors,tutEvents)} style={hBtn({background:"rgba(46,204,113,0.25)",border:"1.5px solid rgba(46,204,113,0.6)"})}>💾 Esporta</button>
        <button onClick={()=>importRef.current.click()} style={hBtn({background:"rgba(52,152,219,0.25)",border:"1.5px solid rgba(52,152,219,0.6)"})}>📂 Importa</button>
        <input ref={importRef} type="file" accept=".json" style={{display:"none"}} onChange={handleImport}/>
      </div>
      <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:12,opacity:0.6}}>{user?.email}</span>
        <button onClick={()=>firebase.auth().signOut()} style={hBtn()}>Esci</button>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <button onClick={()=>setMonthIdx(i=>Math.max(0,i-1))} disabled={monthIdx===0} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"#fff",borderRadius:6,padding:"5px 12px",cursor:"pointer",fontSize:16,opacity:monthIdx===0?0.4:1}}>‹</button>
        <span style={{fontWeight:600,minWidth:150,textAlign:"center"}}>{month.label}</span>
        <button onClick={()=>setMonthIdx(i=>Math.min(MONTHS.length-1,i+1))} disabled={monthIdx===MONTHS.length-1} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"#fff",borderRadius:6,padding:"5px 12px",cursor:"pointer",fontSize:16,opacity:monthIdx===MONTHS.length-1?0.4:1}}>›</button>
        <button onClick={()=>setModal({type:"add",mode:view,prefill:{day:1,start:9,end:10}})} style={{background:"#4f86c6",border:"none",color:"#fff",borderRadius:6,padding:"6px 14px",cursor:"pointer",fontWeight:600}}>+ Aggiungi</button>
      </div>
    </div>

    {importError&&<div style={{background:"#ffeaea",borderBottom:"1px solid #f5c6cb",padding:"6px 20px",fontSize:12,color:"#c0392b",display:"flex",justifyContent:"space-between"}}>⚠️ {importError}<button onClick={()=>setImportError("")} style={{background:"none",border:"none",cursor:"pointer",color:"#c0392b"}}>✕</button></div>}

    {/* SUB-BARS */}
    {view==="tutoraggio"&&(<div style={{background:"#fff",borderBottom:"1px solid #dde",flexShrink:0}}>
      <div style={{padding:"5px 20px",borderBottom:"1px solid #f0f0f0",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <span style={{fontWeight:700,color:"#1a3a5c",fontSize:13}}>🕐 {totalTutOre%1===0?totalTutOre:totalTutOre.toFixed(1)}h tutoraggio</span>
        <span style={{color:"#ddd"}}>│</span>
        {tutors.length===0?<span style={{fontSize:11,color:"#ccc",fontStyle:"italic"}}>Nessun tutor</span>:tutors.map(t=>{const active=activeTutorIds===null||activeTutorIds.has(t.id),col=t.color||"#4f86c6";return<button key={t.id} onClick={()=>toggleTutorFilter(t.id)} style={{fontSize:11,padding:"3px 10px",borderRadius:20,cursor:"pointer",fontWeight:700,border:`2px solid ${col}`,background:active?col:"transparent",color:active?"#fff":col,opacity:active?1:0.5}}>{t.cognome||t.nome}</button>;})}
        <span style={{color:"#ddd"}}>│</span>
        <button onClick={()=>setShowAvvisiOverlay(o=>!o)} style={{fontSize:11,padding:"3px 12px",borderRadius:20,cursor:"pointer",fontWeight:700,border:"2px solid #e07b39",background:showAvvisiOverlay?"#e07b39":"transparent",color:showAvvisiOverlay?"#fff":"#e07b39"}}>{showAvvisiOverlay?"👁 Nascondi avvisi":"👁 Mostra avvisi"}</button>
      </div>
      <div style={{padding:"5px 20px",borderBottom:"1px solid #f0f0f0",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <span style={{fontSize:11,fontWeight:700,color:"#888",minWidth:120,flexShrink:0}}>Avvisi/Progetti</span><span style={{color:"#ddd",flexShrink:0}}>│</span>
        {avvisiForTutBar.length===0?<span style={{fontSize:11,color:"#ccc",fontStyle:"italic"}}>Nessuno</span>:avvisiForTutBar.map(av=><span key={av.id} style={{fontSize:11,padding:"3px 9px",borderRadius:12,fontStyle:"italic",border:`1.5px solid ${hexToRgba(av.color,0.7)}`,fontWeight:600,background:hexToRgba(av.color,0.22),color:"#333"}}>📋 {av.name}</span>)}
      </div>
      <div style={{padding:"5px 20px",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <span style={{fontSize:11,fontWeight:700,color:"#888",minWidth:120,flexShrink:0}}>Tutoraggio</span><span style={{color:"#ddd",flexShrink:0}}>│</span>
        {avvisiNamesInMonth.size===0?<span style={{fontSize:11,color:"#ccc",fontStyle:"italic"}}>Nessuno</span>:[...avvisiNamesInMonth].map(nm=><span key={nm} style={{fontSize:11,padding:"3px 9px",borderRadius:12,fontWeight:600,color:"#444",background:"#f0f4f8",border:"1px solid #dde"}}>{nm.substring(0,28)}</span>)}
      </div>
    </div>)}
    {view==="avviso"&&(<div style={{background:"#fff",borderBottom:"1px solid #dde",flexShrink:0}}>
      <div style={{padding:"5px 20px",borderBottom:"1px solid #f0f0f0",display:"flex",alignItems:"center",gap:8}}><span style={{fontWeight:700,color:"#1a3a5c",fontSize:13}}>🕐 {totalAvOre%1===0?totalAvOre:totalAvOre.toFixed(1)}h avvisi</span></div>
      <div style={{padding:"5px 20px",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <span style={{fontSize:11,fontWeight:700,color:"#888",minWidth:120,flexShrink:0}}>Avvisi/Progetti</span><span style={{color:"#ddd",flexShrink:0}}>│</span>
        {avvisiThisMonth.length===0?<span style={{fontSize:11,color:"#ccc",fontStyle:"italic"}}>Nessuno</span>:avvisiThisMonth.map(av=>{const active=activeAvvisi.has(av.id);return<button key={av.id} onClick={()=>toggleAvviso(av.id)} style={{fontSize:11,padding:"3px 9px",borderRadius:12,cursor:"pointer",border:`1.5px solid ${hexToRgba(av.color,0.8)}`,fontWeight:600,fontStyle:"italic",background:active?hexToRgba(av.color,0.25):"transparent",color:active?"#333":"#aaa"}}>📋 {av.name}</button>;})}
      </div>
    </div>)}

    {/* CALENDAR */}
    {monthView
      ?<MonthView month={month} tutByDay={view==="tutoraggio"?buildMonthTutByDay():null} avByDay={buildMonthAvByDay()} overlayActive={showAvvisiOverlay}/>
      :<CalendarGrid month={month} tutByDay={view==="tutoraggio"?buildTutByDay():null} avOverlayByDay={view==="tutoraggio"?buildAvOverlayByDay():null} avByDay={view==="avviso"?buildAvByDay():null} footerByDay={view==="tutoraggio"?Object.fromEntries(Object.entries(dayTutOre).map(([d,o])=>[d,`${o%1===0?o:o.toFixed(1)}h`])):{}} overlayActive={showAvvisiOverlay} slotH={slotH} onGridClick={handleGridClick} onTutDragEnd={handleTutDragEnd} onAvDragEnd={handleAvDragEnd}/>
    }

    <ZoomBar zoomIdx={zoomIdx} monthView={monthView} onZoomChange={setZoomIdx} onMonthViewToggle={()=>setMonthView(o=>!o)}/>

    {showTutorPanel&&<TutorPanel tutors={tutors} onSave={handleSaveTutors} onClose={()=>setShowTutorPanel(false)}/>}
    {showAnagrafica&&<AnagraficaPanel avvisi={avvisi} onClose={()=>setShowAnagrafica(false)}/>}
    {showUsersPanel&&<UsersPanel onClose={()=>setShowUsersPanel(false)}/>}
    {showRiepilogo&&<RiepilogoPanel avvisi={avvisi} tutors={tutors} tutEvents={tutEvents} currentMonthKey={month.key} onClose={()=>setShowRiepilogo(false)}/>}
    {showSettings&&<SettingsPanel settings={settings} onSave={handleSaveSettings} onClose={()=>setShowSettings(false)}/>}
    {showAiPanel&&<AiPanel tutors={tutors} avvisi={avvisi} settings={settings} user={user} onAddTut={addTutoraggio} onAddAv={addAvviso} onClose={()=>setShowAiPanel(false)}/>}
    {modal&&<AddModal mode={modal.mode||view} prefill={modal.prefill} currentMonthIdx={monthIdx} avvisi={avvisi} tutors={tutors} editTarget={modal.type==="edit-tut"?{type:"tutoraggio",ev:modal.ev}:modal.type==="edit-av"?{type:"avviso",avviso:modal.avviso,ev:modal.ev}:null} onAddTut={addTutoraggio} onEditTut={editTutoraggio} onDeleteTut={deleteTutoraggio} onAddAv={addAvviso} onEditAv={editAvviso} onDeleteAv={deleteAvviso} onClose={()=>setModal(null)}/>}
  </React.Fragment>);
}

window.__mountApp=(user)=>{const root=ReactDOM.createRoot(document.getElementById("root"));root.render(<App user={user}/>);};
</script>
</body>
</html>
