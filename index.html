<body>

<!-- Login screen -->
<div id="login-screen">
  <h1>📅 Calendario Tutoraggi</h1>
  <div id="login-box">
    <div id="login-tabs">
      <button class="login-tab active" onclick="showTab('login')">Accedi</button>
      <button class="login-tab" onclick="showTab('register')">Registrati</button>
    </div>
    <!-- Login form -->
    <div id="tab-login">
      <input id="login-email" type="email" placeholder="Email" autocomplete="email"/>
      <input id="login-password" type="password" placeholder="Password" autocomplete="current-password"/>

      <div class="divider"><span>oppure</span></div>

      <input id="reg-email" type="email" placeholder="Email autorizzata" autocomplete="email"/>
      <input id="reg-password" type="password" placeholder="Scegli una password (min. 6 caratteri)" autocomplete="new-password"/>

<!-- App root (hidden until logged in) -->
<div id="root" style="display:none;"></div>

<!-- Saving indicator -->

<script>
  // ── FIREBASE CONFIG ──────────────────────────────────────────────────────
  // Sostituisci questi valori con quelli del tuo progetto Firebase
  const firebaseConfig = {
    apiKey:            "AIzaSyBYFTqjac0-qoCsXtVe3REgu5Tox74tyms",
    authDomain:        "tutoraggi-6e06b.firebaseapp.com",
    projectId:         "tutoraggi-6e06b",
    storageBucket:     "tutoraggi-6e06b.firebasestorage.app",
    messagingSenderId: "682477734775",
    appId:             "1:682477734775:web:63b092a7cc04f505646f72"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  function showError(msg){ document.getElementById("login-error").textContent = msg; }
  function showTab(tab){
    document.getElementById("tab-login").style.display   = tab==="login"    ? "block" : "none";
    document.getElementById("tab-register").style.display = tab==="register" ? "block" : "none";
    document.querySelectorAll(".login-tab").forEach((b,i)=>{
      b.classList.toggle("active", (tab==="login"&&i===0)||(tab==="register"&&i===1));
    });
    showError("");
  }

  // Google login
  document.getElementById("login-google-btn").addEventListener("click", () => {
    showError("");
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(err => showError("Errore Google: " + err.message));
  });

  // Email/password login
  document.getElementById("login-email-btn").addEventListener("click", async () => {
    showError("");
    const email = document.getElementById("login-email").value.trim();
    const pass  = document.getElementById("login-password").value;
    if(!email||!pass){ showError("Inserisci email e password."); return; }
    try {
      await auth.signInWithEmailAndPassword(email, pass);
    } catch(err) {
      if(err.code==="auth/user-not-found") showError("Account non trovato.");
      else if(err.code==="auth/wrong-password") showError("Password errata.");
      else showError("Errore: " + err.message);
    }
  });

  // Registration with invite check
  document.getElementById("register-btn").addEventListener("click", async () => {
    showError("");
    const email = document.getElementById("reg-email").value.trim().toLowerCase();
    const pass  = document.getElementById("reg-password").value;
    const pass2 = document.getElementById("reg-password2").value;
    if(!email||!pass){ showError("Compila tutti i campi."); return; }
    if(pass.length < 6){ showError("La password deve essere di almeno 6 caratteri."); return; }
    if(pass !== pass2){ showError("Le password non coincidono."); return; }
    try {
      // Check if email is authorized
      const snap = await db.collection("authorizedEmails").doc(email).get();
      if(!snap.exists){ showError("Questa email non è autorizzata. Contatta l'amministratore."); return; }
      // Create account
      await auth.createUserWithEmailAndPassword(email, pass);
    } catch(err) {
      if(err.code==="auth/email-already-in-use") showError("Account già esistente. Usa il tab Accedi.");
      else showError("Errore: " + err.message);
    }
  });

  auth.onAuthStateChanged(user => {
    if (user) {
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("root").style.display = "flex";
      document.getElementById("root").style.flexDirection = "column";
      window.__currentUser = user;
      if (window.__appMounted) window.__appMounted(user);
    } else {
      document.getElementById("login-screen").style.display = "flex";
      document.getElementById("root").style.display = "none";
    }
  });

  // ── FIRESTORE HELPERS ────────────────────────────────────────────────────
  function showSaving() {
    const el = document.getElementById("saving-indicator");
    el.classList.add("show");
    clearTimeout(window.__savingTimer);
    window.__savingTimer = setTimeout(() => el.classList.remove("show"), 1500);
  }

  async function loadData() {
    try {
      const [avvisiSnap, tutorsSnap, tutEventsSnap] = await Promise.all([
        db.collection("avvisi").get(),
        db.collection("tutors").get(),
        db.collection("tutEvents").get(),
      ]);
      const avvisi    = avvisiSnap.docs.map(d => d.data());
      const tutors    = tutorsSnap.docs.map(d => d.data());
      const tutEvents = {};
      tutEventsSnap.docs.forEach(d => { tutEvents[d.id] = d.data(); });
      return { avvisi, tutors, tutEvents };
    } catch(e) {
      console.error("Errore caricamento dati:", e);
      return { avvisi: [], tutors: [], tutEvents: {} };
    }
  }

  async function saveAvvisi(avvisi) {
    showSaving();
    const batch = db.batch();
    // Delete all existing
    const snap = await db.collection("avvisi").get();
    snap.docs.forEach(d => batch.delete(d.ref));
    // Write new
    avvisi.forEach(av => batch.set(db.collection("avvisi").doc(av.id), av));
    await batch.commit();
  }

  async function saveTutors(tutors) {
    showSaving();
    const batch = db.batch();
    const snap = await db.collection("tutors").get();
    snap.docs.forEach(d => batch.delete(d.ref));
    tutors.forEach(t => batch.set(db.collection("tutors").doc(t.id), t));
    await batch.commit();
  }

  async function saveTutEvents(tutorId, monthKey, events) {
    showSaving();
    const ref = db.collection("tutEvents").doc(tutorId);
    await ref.set({ [monthKey]: events }, { merge: true });
  }
</script>

function hexToRgba(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function fmt(h){ return `${String(Math.floor(h)).padStart(2,"0")}:${String(Math.round((h%1)*60)).padStart(2,"0")}`; }
function timeStrToH(s){ const [hh,mm]=s.split(":").map(Number); return hh+(mm||0)/60; }
function hToTimeStr(h){ const hh=Math.floor(h),mm=Math.round((h-hh)*60); return `${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`; }

function layoutEvents(evs){
  const sorted=[...evs].sort((a,b)=>a.start-b.start);
  const cols=[];
  const result=sorted.map(ev=>{
    for(let c=0;c<cols.length;c++) if(cols[c].end<=ev.start){cols[c]={end:ev.end};return{ev,col:c};}
    cols.push({end:ev.end}); return{ev,col:cols.length-1};
  });
  return result.map(({ev,col})=>({ev,col,numCols:cols.length}));
}

function migrateImport(data){
  const {avvisi,tutors,tutEvents}=data;
  return {avvisi:avvisi||[], tutors:tutors||[], tutEvents:tutEvents||{}};
}

function exportData(avvisi,tutors,tutEvents){
  const data={version:3,exportedAt:new Date().toISOString(),avvisi,tutors,tutEvents};
  const b64=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
  const a=document.createElement("a");
  a.href=`data:application/json;base64,${b64}`;
  a.download=`calendario_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

// ── MINI CALENDAR ─────────────────────────────────────────────────────────────
function MiniCalendar({monthData,selected,onSelect}){
  const {year,month,days}=monthData;
  const firstDow=new Date(year,month,1).getDay();
  const offset=firstDow===0?6:firstDow-1;
  const cells=[]; for(let i=0;i<offset;i++) cells.push(null);
  for(let d=1;d<=days;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);
  return(
    <div style={{background:"#fff",border:"1px solid #dde",borderRadius:10,padding:10,
      boxShadow:"0 4px 16px rgba(0,0,0,0.13)",position:"absolute",zIndex:400,top:"100%",left:0,marginTop:4,width:220}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}}>
        {DAY_NAMES_SHORT.map((d,i)=><div key={i} style={{textAlign:"center",fontSize:10,fontWeight:700,color:"#888",padding:"2px 0"}}>{d}</div>)}
        {cells.map((d,i)=>{
          const isSel=d===selected,dow=i%7,isWk=dow===5||dow===6;
          return(
            <div key={i} onClick={()=>d&&onSelect(d)}
              style={{textAlign:"center",fontSize:12,padding:"4px 2px",borderRadius:6,cursor:d?"pointer":"default",
                background:isSel?"#4f86c6":"transparent",color:isSel?"#fff":isWk?"#9b59b6":d?"#333":"transparent",fontWeight:isSel?700:400}}
              onMouseEnter={e=>{if(d&&!isSel)e.currentTarget.style.background="#f0f4f8";}}
              onMouseLeave={e=>{if(d&&!isSel)e.currentTarget.style.background="transparent";}}>
              {d||""}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── TUTOR PANEL ───────────────────────────────────────────────────────────────
function TutorPanel({tutors,onSave,onClose}){
  const [list,setList]=useState(tutors.map(t=>({...t})));
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({id:"",nome:"",cognome:"",cf:"",azienda:"",color:TUTOR_COLORS[0]});
  const inp={display:"block",width:"100%",marginBottom:8,padding:"6px 8px",borderRadius:6,border:"1px solid #ccc",boxSizing:"border-box",fontSize:13};
  function startEdit(i){
    setEditing(i);
    if(i===-1) setForm({id:`tutor-${Date.now()}`,nome:"",cognome:"",cf:"",azienda:"",color:TUTOR_COLORS[list.length%TUTOR_COLORS.length]});
    else setForm({...list[i]});
  }
  function saveForm(){
    if(!form.nome.trim()&&!form.cognome.trim()) return;
    if(editing===-1) setList(prev=>[...prev,form]);
    else setList(prev=>prev.map((t,i)=>i===editing?form:t));
    setEditing(null);
  }
  const fullName=t=>`${t.cognome} ${t.nome}`.trim()||"—";
  return(
    <div style={{position:"fixed",inset:0,zIndex:500,display:"flex"}}>
      <div onClick={onClose} style={{flex:1,background:"rgba(0,0,0,0.35)"}}/>

          {list.length===0&&<p style={{color:"#aaa",fontStyle:"italic",fontSize:13}}>Nessun tutor inserito.</p>}
          {list.map((t,i)=>(
            <div key={t.id} style={{marginBottom:10,borderRadius:10,border:"1px solid #eee",padding:"10px 14px",
              display:"flex",justifyContent:"space-between",alignItems:"center",background:"#fafbfc"}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:14,height:14,borderRadius:4,background:t.color||"#4f86c6",flexShrink:0}}/>
                <div>
                  <div style={{fontWeight:700,fontSize:13,color:"#1a3a5c"}}>{fullName(t)}</div>
                  {t.cf&&<div style={{fontSize:11,color:"#888"}}>CF: {t.cf}</div>}
                  {t.azienda&&<div style={{fontSize:11,color:"#888"}}>Azienda: {t.azienda}</div>}
                </div>

  const [tutEnd,setTutEnd]=useState(hToTimeStr(isEdit&&editTarget.type==="tutoraggio"?editTarget.ev.end:(prefill?.end||10)));
  const [avId,setAvId]=useState(isEdit&&editTarget.type==="avviso"?editTarget.avviso.id:(firstAv?.id||"__new__"));
  const [avColor,setAvColor]=useState(isEdit&&editTarget.type==="avviso"?editTarget.avviso.color:PALETTE[5]);
  const [avDay,setAvDay]=useState(isEdit&&editTarget.type==="avviso"?editTarget.ev.day:(prefill?.day||1));
  const [avStart,setAvStart]=useState(hToTimeStr(isEdit&&editTarget.type==="avviso"?editTarget.ev.start:(prefill?.start||9)));
  const [avEnd,setAvEnd]=useState(hToTimeStr(isEdit&&editTarget.type==="avviso"?editTarget.ev.end:(prefill?.end||13)));
  const [newAvName,setNewAvName]=useState("");
  const inp={display:"block",width:"100%",marginBottom:10,padding:"6px 8px",borderRadius:6,border:"1px solid #ccc",boxSizing:"border-box",fontSize:13};
  const tabBtn=(t,lbl)=>(
    <button onClick={()=>setTab(t)} style={{flex:1,padding:"8px 0",border:"none",cursor:"pointer",fontWeight:600,fontSize:13,borderRadius:6,
      background:tab===t?"#4f86c6":"#f0f4f8",color:tab===t?"#fff":"#555"}}>{lbl}</button>
  );

    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:"#fff",borderRadius:14,padding:24,width:370,boxShadow:"0 8px 32px rgba(0,0,0,0.22)",maxHeight:"90vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <span style={{fontWeight:700,fontSize:15}}>{isEdit?"✏️ Modifica":"➕ Aggiungi"}</span>
          <button onClick={onClose} style={{background:"none",border:"none",fontSize:18,cursor:"pointer",color:"#888"}}>✕</button>
        </div>
        {!isEdit&&<div style={{display:"flex",gap:6,marginBottom:16}}>{tabBtn("tutoraggio","📌 Tutoraggio")}{tabBtn("avviso","📋 Avviso/Progetto")}</div>}
        {tab==="tutoraggio"&&(<>
          <label style={{fontSize:12,color:"#555",display:"block",marginBottom:3}}>Avviso/Progetto</label>
          <select value={tutName} onChange={e=>setTutName(e.target.value)} style={inp}>
            {avvisi.length===0?<option value="">-- prima inserire un avviso --</option>:avvisi.map(a=><option key={a.id} value={a.name}>{a.name}</option>)}
          </select>
          <label style={{fontSize:12,color:"#555",display:"block",marginBottom:3}}>Tutor</label>
          <select value={tutTutor} onChange={e=>setTutTutor(e.target.value)} style={inp}>
            {tutors.length===0?<option value="">-- prima inserire un tutor --</option>:tutors.map(t=><option key={t.id} value={t.id}>{t.cognome} {t.nome}</option>)}
          </select>
          {selTutor&&(
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,padding:"6px 10px",borderRadius:8,background:hexToRgba(selTutor.color||"#4f86c6",0.12)}}>

              }

            <option value="__new__">+ Nuovo avviso...</option>
            {avvisi.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
          </select>
          {avId==="__new__"&&<input value={newAvName} onChange={e=>setNewAvName(e.target.value)} placeholder="Nome nuovo avviso..." style={inp}/>}
          <ColorPicker value={avColor} onChange={setAvColor}/>
          <DayPicker monthData={mData} value={avDay} onChange={setAvDay}/>
          <div style={{display:"flex",gap:10,marginBottom:10}}>
            <TimePicker label="Inizio" value={avStart} onChange={setAvStart}/>
            <TimePicker label="Fine" value={avEnd} onChange={setAvEnd}/>
          </div>
          <p style={{fontSize:11,color:"#888",margin:"0 0 12px"}}>Altri appuntamenti si aggiungono in seguito.</p>
          <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
            <button onClick={onClose} style={{padding:"7px 16px",borderRadius:6,border:"1px solid #ccc",background:"#f5f5f5",cursor:"pointer"}}>Annulla</button>
            <button onClick={()=>{
              const s=timeStrToH(avStart),e=timeStrToH(avEnd);if(e<=s)return;
              const evData={month:monthKey,day:avDay,start:s,end:e,ore:e-s};
              if(isEdit){onEditAvviso(editTarget.avviso.id,editTarget.ev.id,evData,avColor);}
              else if(avId==="__new__"&&newAvName){onAddAvviso({name:newAvName,color:avColor,...evData});}
              else if(avId!=="__new__"){onAddAvviso({existingId:avId,...evData});}
              onClose();
            }} style={{padding:"7px 16px",borderRadius:6,border:"none",background:"#4f86c6",color:"#fff",cursor:"pointer",fontWeight:600}}>{isEdit?"Salva":"Aggiungi"}</button>
          </div>
        </>)}
      </div>
    </div>
  );
}

// ── EVENT BLOCK ───────────────────────────────────────────────────────────────
function EventBlock({ev,col,numCols,color,isAvviso,tutorLabel,onEdit,onClick}){
  const top=(ev.start-8)*SLOT_H;
  const h=Math.max((ev.end-ev.start)*SLOT_H,20);
  const w=`calc(${100/numCols}% - 3px)`;
  const left=`calc(${(col/numCols)*100}% + 1px)`;
  const label=isAvviso?(ev.avvisoName||ev.name):ev.name;
  const bg=isAvviso?hexToRgba(color,0.4):(color||"#4f86c6");
  return(
    <div style={{position:"absolute",top,left,width:w,height:h,borderRadius:5,overflow:"hidden",
      boxSizing:"border-box",zIndex:2,background:bg,border:isAvviso?`1.5px dashed ${hexToRgba(color,0.8)}`:"none"}}
      title={`${label}\n${fmt(ev.start)}–${fmt(ev.end)} (${ev.ore}h)${tutorLabel?"\nTutor: "+tutorLabel:""}`}>
      <div onClick={e=>{e.stopPropagation();onEdit&&onEdit();}}
        style={{padding:"2px 5px",cursor:"pointer",fontSize:10,fontWeight:700,lineHeight:1.3,
          color:isAvviso?"#444":"#fff",background:"rgba(0,0,0,0.08)",
          borderBottom:isAvviso?"1px dashed rgba(0,0,0,0.15)":"1px solid rgba(255,255,255,0.2)",
          whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
        ✏️ {label}
      </div>
      <div onClick={e=>{e.stopPropagation();onClick&&onClick();}}
        style={{padding:"1px 5px",fontSize:10,color:isAvviso?"#555":"rgba(255,255,255,0.9)",cursor:"crosshair",height:"calc(100% - 22px)"}}>
        {fmt(ev.start)}–{fmt(ev.end)}{tutorLabel?` · ${tutorLabel}`:""}
      </div>
    </div>
  );
}

// ── CALENDAR GRID ─────────────────────────────────────────────────────────────
function CalendarGrid({month,evsByDay,footerByDay,onGridClick}){
  const daysArr=Array.from({length:month.days},(_,i)=>i+1);
  const isWeekend=d=>[0,6].includes(new Date(month.year,month.month,d).getDay());
  const getDayName=d=>DAY_NAMES[new Date(month.year,month.month,d).getDay()];
  return(
    <div style={{flex:1,overflowX:"auto",overflowY:"auto"}}>
      <div style={{display:"flex",minWidth:TIME_W+month.days*DAY_W}}>
        <div style={{width:TIME_W,flexShrink:0,position:"sticky",left:0,zIndex:10,background:"#f0f4f8"}}>
          <div style={{height:40,borderBottom:"1px solid #ccc",borderRight:"1px solid #ccc",background:"#e8edf3"}}/>
          <div style={{position:"relative",height:12*SLOT_H}}>
            {HOURS.map(h=>(
              <div key={h} style={{position:"absolute",top:(h-8)*SLOT_H,width:"100%",fontSize:10,color:"#888",
                paddingRight:4,textAlign:"right",borderTop:"1px solid #e0e0e0",height:SLOT_H,boxSizing:"border-box"}}>
                {String(h).padStart(2,"0")}:00
              </div>
            ))}
          </div>
          <div style={{height:20,background:"#e8edf3",borderTop:"1px solid #dde"}}/>
        </div>
        {daysArr.map(d=>{
          const wk=isWeekend(d);
          const laid=layoutEvents(evsByDay[d]||[]);
          const footer=footerByDay?.[d];
          return(
            <div key={d} style={{width:DAY_W,flexShrink:0,borderRight:"1px solid #dde"}}>
              <div style={{height:40,background:wk?"#e8e0f0":"#e8edf3",borderBottom:"1px solid #ccc",
                display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",position:"sticky",top:0,zIndex:5}}>
                <span style={{fontSize:11,color:wk?"#9b59b6":"#555"}}>{getDayName(d)}</span>
                <span style={{fontWeight:700,fontSize:14,color:wk?"#9b59b6":"#1a3a5c"}}>{d}</span>
              </div>
              <div onClick={e=>onGridClick&&onGridClick(d,e)}
                style={{position:"relative",height:12*SLOT_H,background:wk?"rgba(155,89,182,0.04)":"#fff",cursor:"crosshair"}}>
                {HOURS.map(h=><div key={h} style={{position:"absolute",top:(h-8)*SLOT_H,left:0,right:0,height:SLOT_H,borderTop:"1px solid #f0f0f0"}}/>)}
                {laid.map(({ev,col,numCols},i)=>ev.render({col,numCols,key:i}))}
              </div>
              <div style={{height:20,background:wk?"#f0ebf8":"#f5f8fc",borderTop:"1px solid #dde",
                display:"flex",alignItems:"center",justifyContent:"center"}}>
                {footer?<span style={{fontSize:10,fontWeight:700,color:"#1a3a5c"}}>{footer}</span>
                  :<span style={{fontSize:10,color:"#ccc"}}>—</span>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App({user}){
  const [view,setView]=useState("tutoraggio");
  const [tutors,setTutorsState]=useState([]);
  const [activeTutorIds,setActiveTutorIds]=useState(null);
  const [monthIdx,setMonthIdx]=useState(2); // default Marzo
  const [avvisi,setAvvisiState]=useState([]);
  const [activeAvvisi,setActiveAvvisi]=useState(new Set());
  const [tutEvents,setTutEventsState]=useState({});
  const [modal,setModal]=useState(null);
  const [showAnagrafica,setShowAnagrafica]=useState(false);
  const [showTutorPanel,setShowTutorPanel]=useState(false);
  const [showUsersPanel,setShowUsersPanel]=useState(false);
  const [isAdminUser,setIsAdminUser]=useState(false);
  const [loading,setLoading]=useState(true);
  const [importError,setImportError]=useState("");
  const importRef=useRef();

  // Load from Firestore on mount
  useEffect(()=>{
    loadData().then(({avvisi:a,tutors:t,tutEvents:te})=>{
      setAvvisiState(a);
      setTutorsState(t);
      setTutEventsState(te);
      setActiveAvvisi(new Set(a.map(x=>x.id)));
      setLoading(false);
    });
    isAdmin().then(setIsAdminUser);
  },[]);

  const month=MONTHS[monthIdx];

  const allTutEvs=tutors.flatMap(t=>(tutEvents[t.id]?.[month.key])||[]);
  const visibleTutEvs=activeTutorIds===null?allTutEvs:allTutEvs.filter(e=>activeTutorIds.has(e.tutorId));
  const avvisiNamesInMonth=new Set(allTutEvs.map(e=>e.name));
  const avvisiForTutBar=avvisi.filter(av=>avvisiNamesInMonth.has(av.name));
  const dayTutOre={};
  for(const ev of allTutEvs) dayTutOre[ev.day]=(dayTutOre[ev.day]||0)+ev.ore;
  const totalTutOre=visibleTutEvs.reduce((a,e)=>a+e.ore,0);

  const avEvs=avvisi.flatMap(av=>av.events.filter(e=>e.month===month.key).map(e=>({...e,avvisoId:av.id,avvisoName:av.name,avColor:av.color})));
  const avvisiThisMonth=avvisi.filter(av=>av.events.some(e=>e.month===month.key));
  const visibleAvEvs=avEvs.filter(e=>activeAvvisi.has(e.avvisoId));
  const totalAvOre=avEvs.reduce((a,e)=>a+e.ore,0);

  function getTutor(id){return tutors.find(t=>t.id===id);}
  function getTutorLabel(id){const t=getTutor(id);return t?`${t.cognome} ${t.nome}`.trim():"";}
  function getTutorColor(id){const t=getTutor(id);return t?.color||"#4f86c6";}

  function buildTutByDay(){
    const byDay={};
    for(const ev of visibleTutEvs){
      if(!byDay[ev.day])byDay[ev.day]=[];
      const color=getTutorColor(ev.tutorId);
      const tLabel=getTutorLabel(ev.tutorId);
      byDay[ev.day].push({...ev,render:({col,numCols,key})=>(
        <EventBlock key={key} ev={ev} col={col} numCols={numCols} color={color} isAvviso={false} tutorLabel={tLabel}
          onEdit={()=>setModal({type:"edit-tut",ev,monthKey:month.key})}
          onClick={()=>setModal({type:"add",mode:"tutoraggio",prefill:{day:ev.day,start:ev.start,end:ev.end}})}/>
      )});
    }
    return byDay;
  }
  function buildAvByDay(){
    const byDay={};
    for(const ev of visibleAvEvs){
      if(!byDay[ev.day])byDay[ev.day]=[];
      byDay[ev.day].push({...ev,render:({col,numCols,key})=>(
        <EventBlock key={key} ev={ev} col={col} numCols={numCols} color={ev.avColor} isAvviso={true}
          onEdit={()=>{const av=avvisi.find(a=>a.id===ev.avvisoId);setModal({type:"edit-av",avviso:av,ev,monthKey:month.key});}}
          onClick={()=>setModal({type:"add",mode:"avviso",prefill:{day:ev.day,start:ev.start,end:ev.end}})}/>
      )});
    }
    return byDay;
  }

  function handleGridClick(d,e){
    const rect=e.currentTarget.getBoundingClientRect();
    const snap=Math.round((8+(e.clientY-rect.top)/SLOT_H)*4)/4;
    const start=Math.min(Math.max(snap,8),19.75);
    setModal({type:"add",mode:view,prefill:{day:d,start,end:Math.min(start+1,20)}});
  }

  function toggleAvviso(id){setActiveAvvisi(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});}
  function toggleTutorFilter(id){
    setActiveTutorIds(prev=>{
      const all=new Set(tutors.map(t=>t.id));
      const base=prev===null?new Set(all):new Set(prev);
      base.has(id)?base.delete(id):base.add(id);
      return base.size===all.size?null:base;
    });
  }

  async function addTutoraggio(ev){
    const id=`tut-${Date.now()}`;
    const tId=ev.tutorId;
    const newEv={...ev,id};
    const updated={...tutEvents,[tId]:{...(tutEvents[tId]||{}),[month.key]:[...((tutEvents[tId]||{})[month.key]||[]),newEv]}};
    setTutEventsState(updated);
    await saveTutEvents(tId, month.key, updated[tId][month.key]);
  }
  async function editTutoraggio(evId,updated){
    const newState={...tutEvents};
    for(const [tid,months] of Object.entries(newState)){
      for(const [mk,evs] of Object.entries(months)){
        if(evs.find(e=>e.id===evId)){
          newState[tid]={...months,[mk]:evs.map(e=>e.id===evId?{...e,...updated}:e)};
          setTutEventsState(newState);
          await saveTutEvents(tid,mk,newState[tid][mk]);
          return;
        }
      }
    }
  }
  async function addAvviso({existingId,name,color,month:mk,day,start,end,ore}){
    const evData={id:`ave-${Date.now()}`,month:mk,day,start,end,ore};
    let updated;
    if(existingId){
      updated=avvisi.map(av=>av.id===existingId?{...av,events:[...av.events,evData]}:av);
    } else {
      const id=`av-${Date.now()}`;
      updated=[...avvisi,{id,name,color,events:[evData]}];
      setActiveAvvisi(prev=>new Set([...prev,updated[updated.length-1].id]));
    }
    setAvvisiState(updated);
    await saveAvvisi(updated);
  }
  async function editAvviso(avId,evId,evData,color){
    const updated=avvisi.map(av=>av.id!==avId?av:{...av,color,events:av.events.map(e=>e.id===evId?{...e,...evData}:e)});
    setAvvisiState(updated);
    await saveAvvisi(updated);
  }
  async function handleSaveTutors(list){
    setTutorsState(list);
    setActiveTutorIds(null);
    setShowTutorPanel(false);
    await saveTutors(list);
  }

  async function handleImport(e){
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=async ev=>{
      try{
        const raw=JSON.parse(ev.target.result);
        const {avvisi:a,tutors:t,tutEvents:te}=migrateImport(raw);
        setAvvisiState(a); setTutorsState(t); setTutEventsState(te);
        setActiveAvvisi(new Set(a.map(x=>x.id)));
        setActiveTutorIds(null); setImportError("");
        // Save to Firestore
        await saveAvvisi(a);
        await saveTutors(t);
        for(const [tId,months] of Object.entries(te))
          for(const [mk,evs] of Object.entries(months))
            await saveTutEvents(tId,mk,evs);
      } catch(err){setImportError("File non valido: "+err.message);}
    };
    reader.readAsText(file); e.target.value="";
  }

  const viewBtn=(v,lbl)=>({
    padding:"7px 16px",borderRadius:8,border:"none",cursor:"pointer",fontWeight:700,fontSize:13,
    background:view===v?"#fff":"rgba(255,255,255,0.15)",color:view===v?"#1a3a5c":"#fff",
    boxShadow:view===v?"0 2px 8px rgba(0,0,0,0.15)":"none",transition:"all .15s"
  });

  if(loading) return(
    <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:"#888",fontSize:14}}>
      ⏳ Caricamento dati...
    </div>
  );

  return(
    <React.Fragment>
      {/* HEADER */}
      <div style={{background:"#1a3a5c",color:"#fff",padding:"10px 20px",display:"flex",alignItems:"center",gap:10,flexShrink:0,flexWrap:"wrap"}}>
        <span style={{fontWeight:700,fontSize:16}}>📅</span>
        <div style={{display:"flex",gap:4,background:"rgba(255,255,255,0.1)",borderRadius:10,padding:"3px"}}>
          <button style={viewBtn("tutoraggio")} onClick={()=>setView("tutoraggio")}>Calendario Tutoraggi</button>
          <button style={viewBtn("avviso")} onClick={()=>setView("avviso")}>Calendario Avvisi/Progetti</button>
        </div>
        <button onClick={()=>setShowTutorPanel(true)}
          style={{background:"rgba(255,255,255,0.12)",border:"1.5px solid rgba(255,255,255,0.3)",color:"#fff",borderRadius:8,padding:"5px 13px",cursor:"pointer",fontSize:12,fontWeight:600}}>
          👤 Tutor
        </button>
        <button onClick={()=>setShowAnagrafica(true)}
          style={{background:"rgba(255,255,255,0.12)",border:"1.5px solid rgba(255,255,255,0.3)",color:"#fff",borderRadius:8,padding:"5px 13px",cursor:"pointer",fontSize:12,fontWeight:600}}>
          📋 Avvisi/Progetti
        </button>
        {isAdminUser&&(
          <button onClick={()=>setShowUsersPanel(true)}
            style={{background:"rgba(231,76,60,0.25)",border:"1.5px solid rgba(231,76,60,0.6)",color:"#fff",borderRadius:8,padding:"5px 13px",cursor:"pointer",fontSize:12,fontWeight:600}}>
            🔐 Utenti
          </button>
        )}
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>exportData(avvisi,tutors,tutEvents)}
            style={{background:"rgba(46,204,113,0.25)",border:"1.5px solid rgba(46,204,113,0.6)",color:"#fff",borderRadius:8,padding:"5px 13px",cursor:"pointer",fontSize:12,fontWeight:600}}>
            💾 Esporta
          </button>
          <button onClick={()=>importRef.current.click()}
            style={{background:"rgba(52,152,219,0.25)",border:"1.5px solid rgba(52,152,219,0.6)",color:"#fff",borderRadius:8,padding:"5px 13px",cursor:"pointer",fontSize:12,fontWeight:600}}>
            📂 Importa
          </button>
          <input ref={importRef} type="file" accept=".json" style={{display:"none"}} onChange={handleImport}/>
        </div>
        {/* User + logout */}
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:12,opacity:0.7}}>{user?.email}</span>
          <button onClick={()=>auth.signOut()}
            style={{background:"rgba(255,255,255,0.12)",border:"1.5px solid rgba(255,255,255,0.3)",color:"#fff",borderRadius:8,padding:"5px 10px",cursor:"pointer",fontSize:12}}>
            Esci
          </button>
        </div>
        {/* Month nav */}
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <button onClick={()=>setMonthIdx(i=>Math.max(0,i-1))} disabled={monthIdx===0}
            style={{background:"rgba(255,255,255,0.15)",border:"none",color:"#fff",borderRadius:6,padding:"5px 12px",cursor:"pointer",fontSize:16,opacity:monthIdx===0?0.4:1}}>‹</button>
          <span style={{fontWeight:600,minWidth:150,textAlign:"center"}}>{month.label}</span>
          <button onClick={()=>setMonthIdx(i=>Math.min(MONTHS.length-1,i+1))} disabled={monthIdx===MONTHS.length-1}
            style={{background:"rgba(255,255,255,0.15)",border:"none",color:"#fff",borderRadius:6,padding:"5px 12px",cursor:"pointer",fontSize:16,opacity:monthIdx===MONTHS.length-1?0.4:1}}>›</button>
          <button onClick={()=>setModal({type:"add",mode:view,prefill:{day:1,start:9,end:10}})}
            style={{background:"#4f86c6",border:"none",color:"#fff",borderRadius:6,padding:"6px 14px",cursor:"pointer",fontWeight:600}}>+ Aggiungi</button>
        </div>
      </div>

      {importError&&(
        <div style={{background:"#ffeaea",borderBottom:"1px solid #f5c6cb",padding:"6px 20px",fontSize:12,color:"#c0392b",display:"flex",justifyContent:"space-between"}}>
          ⚠️ {importError}
          <button onClick={()=>setImportError("")} style={{background:"none",border:"none",cursor:"pointer",color:"#c0392b"}}>✕</button>
        </div>
      )}

      {/* SUB-BAR TUTORAGGIO */}
      {view==="tutoraggio"&&(
        <div style={{background:"#fff",borderBottom:"1px solid #dde",flexShrink:0}}>
          <div style={{padding:"5px 20px",borderBottom:"1px solid #f0f0f0",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
            <span style={{fontWeight:700,color:"#1a3a5c",fontSize:13}}>🕐 {totalTutOre%1===0?totalTutOre:totalTutOre.toFixed(1)}h tutoraggio</span>
            <span style={{color:"#ddd"}}>│</span>
            {tutors.length===0
              ?<span style={{fontSize:11,color:"#ccc",fontStyle:"italic"}}>Nessun tutor — usa 👤 Tutor per aggiungerne</span>
              :tutors.map(t=>{
                const active=activeTutorIds===null||activeTutorIds.has(t.id);
                const col=t.color||"#4f86c6";
                return(
                  <button key={t.id} onClick={()=>toggleTutorFilter(t.id)} style={{fontSize:11,padding:"3px 10px",borderRadius:20,cursor:"pointer",fontWeight:700,transition:"all .15s",
                    border:`2px solid ${col}`,background:active?col:"transparent",color:active?"#fff":col,opacity:active?1:0.5}}>
                    {t.cognome||t.nome}
                  </button>
                );
              })
            }
          </div>
          <div style={{padding:"5px 20px",borderBottom:"1px solid #f0f0f0",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <span style={{fontSize:11,fontWeight:700,color:"#888",minWidth:120,flexShrink:0}}>Avvisi/Progetti</span>
            <span style={{color:"#ddd",flexShrink:0}}>│</span>
            {avvisiForTutBar.length===0?<span style={{fontSize:11,color:"#ccc",fontStyle:"italic"}}>Nessuno in questo mese</span>
              :avvisiForTutBar.map(av=>(
                <span key={av.id} style={{fontSize:11,padding:"3px 9px",borderRadius:12,fontStyle:"italic",
                  border:`1.5px solid ${hexToRgba(av.color,0.7)}`,fontWeight:600,background:hexToRgba(av.color,0.22),color:"#333"}}>
                  📋 {av.name}
                </span>
              ))
            }
          </div>
          <div style={{padding:"5px 20px",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <span style={{fontSize:11,fontWeight:700,color:"#888",minWidth:120,flexShrink:0}}>Tutoraggio</span>
            <span style={{color:"#ddd",flexShrink:0}}>│</span>
            {avvisiNamesInMonth.size===0?<span style={{fontSize:11,color:"#ccc",fontStyle:"italic"}}>Nessuno in questo mese</span>
              :[...avvisiNamesInMonth].map(nm=>(
                <span key={nm} style={{fontSize:11,padding:"3px 9px",borderRadius:12,fontWeight:600,color:"#444",background:"#f0f4f8",border:"1px solid #dde"}}>
                  {nm.substring(0,28)}
                </span>
              ))
            }
          </div>
        </div>
      )}

      {/* SUB-BAR AVVISI */}
      {view==="avviso"&&(
        <div style={{background:"#fff",borderBottom:"1px solid #dde",flexShrink:0}}>
          <div style={{padding:"5px 20px",borderBottom:"1px solid #f0f0f0",display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontWeight:700,color:"#1a3a5c",fontSize:13}}>🕐 {totalAvOre%1===0?totalAvOre:totalAvOre.toFixed(1)}h totali avvisi</span>
          </div>
          <div style={{padding:"5px 20px",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <span style={{fontSize:11,fontWeight:700,color:"#888",minWidth:120,flexShrink:0}}>Avvisi/Progetti</span>
            <span style={{color:"#ddd",flexShrink:0}}>│</span>
            {avvisiThisMonth.length===0?<span style={{fontSize:11,color:"#ccc",fontStyle:"italic"}}>Nessuno in questo mese</span>
              :avvisiThisMonth.map(av=>{
                const active=activeAvvisi.has(av.id);
                return(
                  <button key={av.id} onClick={()=>toggleAvviso(av.id)} style={{fontSize:11,padding:"3px 9px",borderRadius:12,cursor:"pointer",
                    border:`1.5px solid ${hexToRgba(av.color,0.8)}`,fontWeight:600,fontStyle:"italic",transition:"all .15s",
                    background:active?hexToRgba(av.color,0.25):"transparent",color:active?"#333":"#aaa"}}>
                    📋 {av.name}
                  </button>
                );
              })
            }
          </div>
        </div>
      )}

      <CalendarGrid
        month={month}
        evsByDay={view==="tutoraggio"?buildTutByDay():buildAvByDay()}
        footerByDay={view==="tutoraggio"?Object.fromEntries(Object.entries(dayTutOre).map(([d,o])=>[d,`${o%1===0?o:o.toFixed(1)}h`])):{}}
        onGridClick={handleGridClick}
      />

      {showTutorPanel&&<TutorPanel tutors={tutors} onSave={handleSaveTutors} onClose={()=>setShowTutorPanel(false)}/>}
      {showAnagrafica&&<AnagraficaPanel avvisi={avvisi} onClose={()=>setShowAnagrafica(false)}/>}
      {showUsersPanel&&<UsersPanel onClose={()=>setShowUsersPanel(false)}/>}
      {modal&&(
        <AddModal
          mode={modal.mode||view} prefill={modal.prefill}
          monthKey={modal.monthKey||month.key}
          avvisi={avvisi} tutors={tutors}
          editTarget={modal.type==="edit-tut"?{type:"tutoraggio",ev:modal.ev}:modal.type==="edit-av"?{type:"avviso",avviso:modal.avviso,ev:modal.ev}:null}
          onAddTutoraggio={addTutoraggio} onEditTutoraggio={editTutoraggio}
          onAddAvviso={addAvviso} onEditAvviso={editAvviso}
          onClose={()=>setModal(null)}
        />
      )}
    </React.Fragment>
  );
}

// Mount app when user is authenticated
window.__appMounted = (user) => {
  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App user={user}/>);
};
</script>
</body>
</html>
